<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Tracker · Paper Gremlin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07110e;--panel:#0c1814;--cream:#f1e7cf;--gold:#d8aa5a;--muted:#a99e89;--line:rgba(216,170,90,.2)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#13251d 0,#07110e 45%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}
.top{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw;gap:28px;background:rgba(5,14,11,.9)}
.brand{display:flex;align-items:center;gap:12px;color:var(--cream);text-decoration:none;font-weight:700}.mark{width:39px;height:39px;border:1px solid rgba(239,198,113,.68);border-radius:50%;display:grid;place-items:center;color:#efc671;background:rgba(9,25,22,.58)}
nav{margin-left:auto;display:flex;gap:24px}nav a{color:#d9cfba;text-decoration:none;font:700 11px Arial;letter-spacing:.1em;text-transform:uppercase}
main{width:min(1450px,94vw);margin:42px auto 80px}.kicker{font:700 11px Arial;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(38px,5vw,70px);margin:8px 0 6px}.sub{color:var(--muted);font-size:17px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:34px 0 18px;gap:14px}.month{font-size:28px}.buttons{display:flex;gap:8px}button{border:1px solid var(--line);background:#102019;color:var(--cream);padding:10px 14px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--gold)}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.week div{padding:10px;color:var(--gold);font:700 10px Arial;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.day{min-height:118px;border:1px solid var(--line);padding:9px;background:rgba(12,24,20,.72);position:relative}.day.out{opacity:.3}.day.today{box-shadow:inset 0 0 0 1px var(--gold)}.num{font:700 12px Arial;color:var(--muted);margin-bottom:8px}.covers{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.covers:has(.cover:nth-child(4)) .cover{width:48px;height:72px}.cover{width:64px;height:96px;object-fit:cover;border-radius:3px;box-shadow:0 5px 12px #0008;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.cover:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 9px 18px #000b,0 0 0 1px rgba(216,170,90,.38)}.placeholder{width:64px;height:96px;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;text-align:center;padding:3px}.add{position:absolute;right:7px;top:6px;background:none;border:0;color:var(--gold);font-size:20px;padding:0}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.box{width:min(620px,96vw);max-height:80vh;overflow:auto;background:#0c1814;border:1px solid var(--line);padding:24px}.box input{width:100%;padding:12px;background:#07110e;border:1px solid var(--line);color:var(--cream);margin:12px 0}.result{display:flex;gap:12px;align-items:center;padding:10px;border-top:1px solid var(--line);cursor:pointer}.result img{width:42px;height:62px;object-fit:cover}.result small{color:var(--muted)}.daybook{display:grid;grid-template-columns:100px 1fr;gap:20px;align-items:start}.daybook img{width:100px;max-height:150px;object-fit:cover;border-radius:4px;box-shadow:0 8px 22px #0009}.daybook h2{margin:2px 0 7px;font-size:27px}.daybook .date{color:var(--gold);font:700 10px Arial;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.dayactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.danger{border-color:rgba(214,120,110,.35);color:#e7b0aa}
@media(max-width:800px){nav{display:none}.day{min-height:92px;padding:5px}.cover,.placeholder{width:42px;height:63px}.month{font-size:22px}}
</style></head>
<body>
<header class="top"><a class="brand" href="index.html"><span class="mark">✦</span><span>Paper Gremlin</span></a><nav><a href="dashboard.html">Home</a><a href="discover.html">Discover</a><a href="clubs.html">Clubs</a><a href="beta-reading.html">Beta</a><a href="reading-tracker.html">Tracker</a><a href="dogears.html">DogEars</a><a href="marketplace.html">Marketplace</a></nav></header>
<main><div class="kicker">Your Reading Life</div><h1>Reading Tracker</h1><div class="sub">A month in books. Add a cover to every day you read.</div><div id="stats" class="sub" style="margin-top:12px;color:var(--gold)"></div>
<div class="toolbar"><div class="buttons"><button id="prev">←</button><button id="today">Today</button><button id="next">→</button></div><div class="month" id="month"></div></div>
<div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="calendar" id="cal"></div></main>
<div class="modal" id="modal"><div class="box"><button id="close" style="float:right">×</button><div class="kicker">Add to reading day</div><h2 id="dateTitle"></h2><input id="search" placeholder="Search books or authors…"><div id="results"></div></div></div>
<div class="modal" id="bookModal"><div class="box"><button id="bookClose" style="float:right">×</button><div id="bookPanel"></div></div></div>
<script>
const S="https://nrtutxjznkfvvbmaagum.supabase.co",K="sb_publishable_C2t5VVsQQGqHhniETEky6A_XDK1Oycu",sb=supabase.createClient(S,K);
let user,view=new Date(),selectedDate="",entries=[],history=[];
const $=id=>document.getElementById(id),iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day};
async function init(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href="auth.html";return}user=u;await load()}
async function load(){const start=new Date(view.getFullYear(),view.getMonth(),1),end=new Date(view.getFullYear(),view.getMonth()+1,0);
const {data,error}=await sb.from("reading_calendar_entries").select("id,reading_date,book_id,books(id,title,cover_url)").gte("reading_date",iso(start)).lte("reading_date",iso(end)).order("reading_date");if(error)console.error(error);entries=data||[];const {data:h,error:he}=await sb.from("user_reading_history").select("id,book_id,started_on,finished_on").eq("user_id",user.id);if(he)console.error(he);history=h||[];render()}
function render(){const days=new Set(entries.map(e=>e.reading_date)).size,books=new Set(entries.map(e=>e.book_id)).size;const monthStart=iso(new Date(view.getFullYear(),view.getMonth(),1)),monthEnd=iso(new Date(view.getFullYear(),view.getMonth()+1,0)),finished=history.filter(h=>h.finished_on&&h.finished_on>=monthStart&&h.finished_on<=monthEnd).length;let streak=0,d=new Date();while(entries.some(e=>e.reading_date===iso(d))){streak++;d.setDate(d.getDate()-1)}$("stats").textContent=days+" reading day"+(days===1?"":"s")+" · "+books+" book"+(books===1?"":"s")+" this month · "+finished+" finished · "+streak+" day current streak";$("month").textContent=view.toLocaleDateString(undefined,{month:"long",year:"numeric"});const first=new Date(view.getFullYear(),view.getMonth(),1),last=new Date(view.getFullYear(),view.getMonth()+1,0),cells=[];for(let i=0;i<first.getDay();i++)cells.push(null);for(let d=1;d<=last.getDate();d++)cells.push(new Date(view.getFullYear(),view.getMonth(),d));while(cells.length%7)cells.push(null);
$("cal").innerHTML=cells.map(d=>{if(!d)return '<div class="day out"></div>';const key=iso(d),books=entries.filter(e=>e.reading_date===key),today=key===iso(new Date());return '<div class="day '+(today?'today':'')+'"><button class="add" data-date="'+key+'">+</button><div class="num">'+d.getDate()+'</div><div class="covers">'+books.map(e=>e.books?.cover_url?'<img class="cover" src="'+e.books.cover_url+'" title="'+esc(e.books.title)+'" data-entry="'+e.id+'" data-book="'+e.book_id+'">':'<div class="placeholder">'+esc(e.books?.title||"Book")+'</div>').join("")+'</div></div>'}).join("");
document.querySelectorAll(".add").forEach(b=>b.onclick=()=>openDay(b.dataset.date));document.querySelectorAll(".cover").forEach(x=>x.onclick=()=>openBookEntry(Number(x.dataset.entry)))}

function openBookEntry(entryId){const e=entries.find(x=>Number(x.id)===Number(entryId));if(!e)return;const date=new Date(e.reading_date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});const h=history.find(x=>Number(x.book_id)===Number(e.book_id));const fmt=x=>x?new Date(x+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";const status=h?(h.started_on?"Started "+fmt(h.started_on)+" ✓":"Not marked started")+(h.finished_on?" · Finished "+fmt(h.finished_on)+" ✓":""):"No start/finish dates yet";const historyButtons=h&&(h.started_on||h.finished_on)?'<button id="editDates">Edit dates</button>':'<button id="markStarted">Mark started this day</button><button id="markFinished">Mark finished this day</button>';$("bookPanel").innerHTML='<div class="daybook">'+(e.books?.cover_url?'<img src="'+e.books.cover_url+'" alt="">':'')+'<div><div class="date">'+esc(date)+'</div><h2>'+esc(e.books?.title||"Book")+'</h2><p class="sub">You read this book on this day.</p><p class="sub" style="color:var(--gold)">'+esc(status)+'</p><div class="dayactions">'+historyButtons+'<button id="openDetails">Open book details</button><button class="danger" id="removeEntry">Remove from this day</button></div></div></div>';$("bookModal").classList.add("show");if($("markStarted"))$("markStarted").onclick=()=>setHistoryDate(e.book_id,"started_on",e.reading_date);if($("markFinished"))$("markFinished").onclick=()=>setHistoryDate(e.book_id,"finished_on",e.reading_date);if($("editDates"))$("editDates").onclick=()=>editHistoryDates(e);$("openDetails").onclick=()=>location.href="book-detail.html?id="+e.book_id;$("removeEntry").onclick=()=>removeEntry(e.id)}
async function editHistoryDates(e){const h=history.find(x=>Number(x.book_id)===Number(e.book_id));const started=prompt("Started date (YYYY-MM-DD). Leave blank to clear.",h?.started_on||"");if(started===null)return;const finished=prompt("Finished date (YYYY-MM-DD). Leave blank to clear.",h?.finished_on||"");if(finished===null)return;const valid=x=>!x||/^\\d{4}-\\d{2}-\\d{2}$/.test(x);if(!valid(started)||!valid(finished)){alert("Use YYYY-MM-DD dates.");return}let error;if(h){({error}=await sb.from("user_reading_history").update({started_on:started||null,finished_on:finished||null,updated_at:new Date().toISOString()}).eq("id",h.id))}else{({error}=await sb.from("user_reading_history").insert({user_id:user.id,book_id:e.book_id,started_on:started||null,finished_on:finished||null}))}if(error){alert(error.message);return}$("bookModal").classList.remove("show");await load()}
async function setHistoryDate(bookId,field,date){const existing=history.find(x=>Number(x.book_id)===Number(bookId));let error;if(existing){({error}=await sb.from("user_reading_history").update({[field]:date,updated_at:new Date().toISOString()}).eq("id",existing.id))}else{const row={user_id:user.id,book_id:bookId,[field]:date};({error}=await sb.from("user_reading_history").insert(row))}if(error){alert(error.message);return}$("bookModal").classList.remove("show");await load()}
async function removeEntry(id){if(!confirm("Remove this book from this reading day?"))return;const {error}=await sb.from("reading_calendar_entries").delete().eq("id",id);if(error){alert(error.message);return}$("bookModal").classList.remove("show");await load()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function openDay(d){selectedDate=d;$("dateTitle").textContent=new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});$("modal").classList.add("show");$("search").value="";await searchBooks("")}
let searchTimer=null, catalogResults=[];
async function searchBooks(q){
  const clean=String(q||"").trim();
  if(!clean){$("results").innerHTML='<p class="sub">Type a title or author to search the Paper Gremlin catalog.</p>';return}
  $("results").innerHTML='<p class="sub">Searching the shelves…</p>';
  const {data,error}=await sb.functions.invoke("book-search",{body:{q:clean,page:1,page_size:20}});
  if(error||data?.error){$("results").innerHTML='<p class="sub">Catalog search could not be reached. Try again.</p>';return}
  catalogResults=Array.isArray(data?.results)?data.results:[];
  $("results").innerHTML=catalogResults.length?catalogResults.map((b,i)=>{
    const cover=b.cover_id?"https://covers.openlibrary.org/b/id/"+encodeURIComponent(b.cover_id)+"-M.jpg":"";
    return '<div class="result" data-catalog="'+i+'">'+(cover?'<img src="'+cover+'">':'')+'<div><b>'+esc(b.title||"Untitled")+'</b><br><small>'+esc((b.author_names||[]).join(", "))+'</small></div></div>'
  }).join(""):'<p class="sub">No books found. Try another title or author.</p>';
  document.querySelectorAll("[data-catalog]").forEach(r=>r.onclick=()=>addCatalogBook(catalogResults[Number(r.dataset.catalog)]))
}
async function addCatalogBook(b){
  if(!b)return;
  const isbns=Array.isArray(b.isbn)?b.isbn.map(v=>String(v).replace(/[^0-9Xx]/g,"")):[];
  const isbn13=isbns.find(v=>v.length===13)||null,isbn10=isbns.find(v=>v.length===10)||null;
  const key=String(b.source_work_key||"").replace(/^\/works\//,"");
  const cover=b.cover_id?"https://covers.openlibrary.org/b/id/"+encodeURIComponent(b.cover_id)+"-L.jpg":null;
  $("results").innerHTML='<p class="sub">Adding '+esc(b.title||"book")+'…</p>';
  const {data:id,error}=await sb.rpc("get_or_create_book",{new_isbn_13:isbn13,new_isbn_10:isbn10,new_google_books_id:key?"OL-"+key:null,new_title:b.title||"Untitled",new_subtitle:b.subtitle||null,new_authors:Array.isArray(b.author_names)?b.author_names:[],new_publisher:null,new_published_date:b.first_publish_year?String(b.first_publish_year):null,new_description:null,new_cover_url:cover});
  if(error){$("results").innerHTML='<p class="sub">'+esc(error.message)+'</p>';return}
  await addBook(Number(id));
}
async function addBook(bookId){const {error}=await sb.from("reading_calendar_entries").insert({user_id:user.id,book_id:bookId,reading_date:selectedDate});if(error&&error.code!=="23505"){alert(error.message);return}$("modal").classList.remove("show");await load()}
$("search").oninput=e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>searchBooks(q),300)};$("close").onclick=()=>$("modal").classList.remove("show");$("bookClose").onclick=()=>$("bookModal").classList.remove("show");$("bookModal").onclick=e=>{if(e.target===$("bookModal"))$("bookModal").classList.remove("show")};$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
$("prev").onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);await load()};$("next").onclick=async()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);await load()};$("today").onclick=async()=>{view=new Date();await load()};init();
</script></body></html>
