<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore Paper Gremlin — discover books, clubs, reading tools, DogEars, and more.">
<title>Explore · Paper Gremlin</title>
<link rel="stylesheet" href="assets/paper-gremlin-app.css?v=20260927c" data-pg-skin="1">
<style>
:root{--night:#020d0f;--cream:#f6dfaa;--gold:#efbd58;--line:rgba(224,170,74,.5)}
*{box-sizing:border-box}
body{margin:0!important;background:var(--night)!important;color:#fff;overflow-x:hidden}
.explore-page{width:100%;background:#020d0f;padding-bottom:34px}
.explore-world{position:relative;width:100%;aspect-ratio:16/9;background:#020d0f url("explore-world-v2.png") center top/100% 100% no-repeat;overflow:hidden}
.flip-target{position:absolute;perspective:1100px;cursor:pointer;border:0;background:transparent;padding:0;z-index:4}
.flip-inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip-target.is-flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border-radius:1.2vw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-front{background:transparent}
.flip-back{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(12px,1.45vw,28px);text-align:left;background:linear-gradient(145deg,rgba(3,19,20,.985),rgba(7,36,31,.985));border:1px solid rgba(239,189,88,.72);box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 0 35px rgba(239,189,88,.05);color:#efe4d0}
.flip-back h3{margin:0 0 .55em;font-size:clamp(15px,1.35vw,27px);font-weight:400;color:var(--cream)}
.flip-back p{margin:0;font-size:clamp(10px,.9vw,17px);line-height:1.45;color:#e7dcc8}
.flip-back .learn{margin-top:1em;color:var(--gold);font:800 clamp(8px,.65vw,12px)/1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.flip-target:focus-visible{outline:3px solid #ffd36c;outline-offset:3px;border-radius:1.2vw}
.flip-target[data-card="books"]{left:2.85%;top:69.35%;width:23.05%;height:18.95%}
.flip-target[data-card="clubs"]{left:27.05%;top:69.35%;width:22.25%;height:18.95%}
.flip-target[data-card="tracker"]{left:50.55%;top:69.35%;width:22.65%;height:18.95%}
.flip-target[data-card="dogears"]{left:74.45%;top:69.35%;width:22.75%;height:18.95%}
.more-grid{width:min(1500px,calc(100% - 48px));margin:22px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.more-grid a{padding:16px 18px;border:1px solid rgba(224,170,74,.25);border-radius:10px;text-decoration:none;color:#e9d9b9!important;background:rgba(7,25,23,.74);font:700 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:center}
@media(max-width:800px){.more-grid{grid-template-columns:repeat(2,1fr)}.flip-back .learn{display:none}}
@media(max-width:520px){.more-grid{grid-template-columns:1fr}.flip-back{padding:8px}.flip-back p{line-height:1.25}}
@media(prefers-reduced-motion:reduce){.flip-inner{transition:none}}
</style>
</head>
<body>
<main class="explore-page">
<section class="explore-world" aria-label="Explore Paper Gremlin features">
<button class="flip-target" data-card="books" type="button" aria-label="Discover Books — click to learn more" aria-pressed="false"><span class="flip-inner"><span class="flip-face flip-front"></span><span class="flip-face flip-back"><h3>Discover Books</h3><p>Search Paper Gremlin’s catalog, find the exact edition you’re reading, explore covers and book details, and discover what to read next.</p><span class="learn">Click to flip back</span></span></span></button>
<button class="flip-target" data-card="clubs" type="button" aria-label="Join Book Clubs — click to learn more" aria-pressed="false"><span class="flip-inner"><span class="flip-face flip-front"></span><span class="flip-face flip-back"><h3>Join Book Clubs</h3><p>Find reading communities, join conversations, vote on upcoming books, share DogEars, and read alongside other Gremlins.</p><span class="learn">Click to flip back</span></span></span></button>
<button class="flip-target" data-card="tracker" type="button" aria-label="Track Your Reading — click to learn more" aria-pressed="false"><span class="flip-inner"><span class="flip-face flip-front"></span><span class="flip-face flip-back"><h3>Track Your Reading</h3><p>Use your monthly reading calendar to record the days you read, see book covers across your month, and build a visual history of your reading life.</p><span class="learn">Click to flip back</span></span></span></button>
<button class="flip-target" data-card="dogears" type="button" aria-label="Use DogEars — click to learn more" aria-pressed="false"><span class="flip-inner"><span class="flip-face flip-front"></span><span class="flip-face flip-back"><h3>Use DogEars</h3><p>Save thoughts and memorable moments while you read. Keep them personal or share selected DogEars with your book club.</p><span class="learn">Click to flip back</span></span></span></button>
</section>
<nav class="more-grid" aria-label="More Paper Gremlin features"><a href="badges.html">Earn Badges</a><a href="beta-reading.html">Beta Reading</a><a href="marketplace.html">Marketplace</a><a href="profile.html">Your Profile</a></nav>
</main>
<script>
document.querySelectorAll(".flip-target").forEach(card=>{
 card.addEventListener("click",()=>{
  const flipped=card.classList.toggle("is-flipped");
  card.setAttribute("aria-pressed",String(flipped));
 });
});
</script>
<script src="assets/paper-gremlin-nav.js?v=20260927h"></script>
</body>
</html>
