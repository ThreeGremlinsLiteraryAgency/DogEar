name: Import popular covered books into Cloudflare
on:
  schedule:
    - cron: '17 6 * * *' # once daily, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-popular-100k.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-gremlin-catalog-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: cloudflare/catalog
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Fetch priority catalog (skip until ready)
        id: artifact
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="paper-gremlin-priority-100k" and .expired==false) | .id' | head -1)
          if [ -z "$id" ]; then
            echo "Priority catalog not ready; safely skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > priority.zip
          unzip -o priority.zip paper-gremlin-priority-100k.jsonl.gz
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Import priority batches with resume cursor
        if: steps.artifact.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="CREATE TABLE IF NOT EXISTS catalog_priority_progress(id INTEGER PRIMARY KEY CHECK(id=1), next_offset INTEGER NOT NULL DEFAULT 0,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);" --yes
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="INSERT OR IGNORE INTO catalog_priority_progress(id,next_offset) VALUES(1,0);" --yes
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="SELECT next_offset FROM catalog_priority_progress WHERE id=1;" --json > priority-offset.json
          OFFSET=$(python3 - <<'PY'
          import json
          d=json.load(open("priority-offset.json"))
          print(int(d[0]["results"][0]["next_offset"]))
          PY
          )
          if [ "$OFFSET" -ge 100000 ]; then echo "Target complete"; exit 0; fi
          REMAIN=$((100000-OFFSET))
          if [ "$REMAIN" -gt 3000 ]; then REMAIN=3000; fi
          python3 scripts/prepare_priority_d1.py --start "$OFFSET" --count "$REMAIN" --chunk 100
          python3 scripts/import_with_budget.py
