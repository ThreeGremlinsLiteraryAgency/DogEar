name: Import staged Open Library works into D1
on:
  # Scheduled import paused pending popularity-ranked queue.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-gremlin-catalog-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cloudflare/catalog
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Download latest staged artifact
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="paper-gremlin-openlibrary-250k" and .expired==false) | .id' | head -1)
          test -n "$id" || { echo "::error::No completed staging artifact yet"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > catalog-artifact.zip
          unzip -o catalog-artifact.zip openlibrary-250k-works.jsonl.gz
      - name: Initialize durable bulk cursor
        run: |
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="CREATE TABLE IF NOT EXISTS catalog_bulk_progress (id INTEGER PRIMARY KEY CHECK(id=1), next_offset INTEGER NOT NULL DEFAULT 0, updated_at TEXT DEFAULT CURRENT_TIMESTAMP);" --yes
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="INSERT OR IGNORE INTO catalog_bulk_progress (id,next_offset) VALUES (1,0);" --yes
      - name: Determine offset and storage
        id: progress
        run: |
          npx wrangler d1 execute paper-gremlin-catalog --remote --command="SELECT next_offset FROM catalog_bulk_progress WHERE id=1;" --json > offset.json
          python3 - <<'PY'
          import json,os
          d=json.load(open("offset.json"))
          row=d[0]["results"][0] if isinstance(d,list) else d["result"][0]["results"][0]
          val=int(row["next_offset"])
          if not 0<=val<=100000:raise ValueError(val)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"offset={val}\n")
          PY
      - name: Stop if target reached
        if: steps.progress.outputs.offset == '100000'
        run: echo "Target of 100,000 staged works processed."
      - name: Build next SQL batches
        if: steps.progress.outputs.offset != '100000'
        run: python3 scripts/prepare_250k_d1.py --start ${{ steps.progress.outputs.offset }} --count 1000 --chunk 100
      - name: Import with 450 MB safety ceiling and checkpoint
        if: steps.progress.outputs.offset != '100000'
        env:
          OFFSET: ${{ steps.progress.outputs.offset }}
        run: |
          for file in batches/*.sql; do
            size=$(npx wrangler d1 info paper-gremlin-catalog --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("file_size",d.get("fileSize",0)))')
            if [ "$size" -ge 450000000 ]; then
              echo "::warning::Stopping at 450 MB database safety ceiling"
              exit 0
            fi
            npx wrangler d1 execute paper-gremlin-catalog --remote --file="$file" --yes
            npx wrangler d1 execute paper-gremlin-catalog --remote --command="UPDATE catalog_bulk_progress SET next_offset=next_offset+100,updated_at=CURRENT_TIMESTAMP WHERE id=1 AND next_offset=$OFFSET;" --yes
            OFFSET=$((OFFSET+100))
          done
