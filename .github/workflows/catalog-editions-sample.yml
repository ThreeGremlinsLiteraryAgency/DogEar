name: Import Open Library editions sample
on:
  workflow_dispatch:
    inputs:
      execute_import:
        description: "Write to production D1 (default false)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: paper-gremlin-catalog-import
  cancel-in-progress: false
jobs:
  editions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/catalog
    steps:
      - uses: actions/checkout@v4
      - name: Generate edition SQL
        run: |
          python3 scripts/import_openlibrary_api_editions.py
          test -s batches/editions.sql
      - name: Install Wrangler
        if: ${{ inputs.execute_import }}
        run: npm install --no-audit --no-fund
      - name: Import editions
        if: ${{ inputs.execute_import }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute paper-gremlin-catalog --remote --file=batches/editions.sql --yes
