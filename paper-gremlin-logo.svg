<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Paper Gremlin</title>
  <desc id="desc">Nimsy, a small bookish gremlin, peeking over an open book beneath a crescent moon.</desc>
