<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Paper Gremlin — Opening Book</title>

  <style>
    :root{
      --ink:#090b0a;
      --cream:#f1e7cf;
      --gold:#c79b59;
      --gold-soft:#dfbd7e;
      --muted:#aaa18f;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(52,72,58,.28),
          transparent 32%
        ),
        var(--ink);
      color:var(--cream);
      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    .loading{
      width:min(500px,calc(100% - 40px));
      text-align:center;
    }

    .mark{
      width:54px;
      height:54px;
      margin:0 auto 22px;
      border:1px solid var(--gold);
      border-radius:50% 50% 50% 12%;
      animation:pulse 1.1s infinite alternate;
    }

    h1{
      margin:0 0 10px;
      font-size:30px;
      font-weight:400;
    }

    p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }

    a{
      display:inline-block;
      margin-top:20px;
      color:var(--gold-soft);
      font-family:Arial,Helvetica,sans-serif;
      font-size:11px;
      font-weight:800;
      letter-spacing:.09em;
      text-transform:uppercase;
    }

    @keyframes pulse{
      from{
        opacity:.35;
        transform:rotate(-8deg) scale(.95);
      }

      to{
        opacity:1;
        transform:rotate(-8deg) scale(1.05);
      }
    }
  </style>
</head>

<body>

  <main class="loading">

    <div class="mark"></div>

    <h1>
      Pulling that book off the shelf…
    </h1>

    <p id="message">
      Opening the Paper Gremlin book page.
    </p>

    <a
      id="fallbackLink"
      href="search.html"
      hidden
    >
      Return to Search
    </a>

  </main>

  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );

    /*
      Old Paper Gremlin links used:
      books.html?id=GOOGLE_BOOK_ID

      Some newer links may already use google_id.
    */

    const googleBookId =
      params.get("google_id") ||
      params.get("googleId") ||
      params.get("id");

    const localBookId =
      params.get("book_id") ||
      params.get("bookId") ||
      params.get("local_id");

    const message =
      document.getElementById(
        "message"
      );

    const fallbackLink =
      document.getElementById(
        "fallbackLink"
      );

    if(localBookId){

      window.location.replace(
        "book-detail.html?id=" +
        encodeURIComponent(
          localBookId
        )
      );

    }

    else if(googleBookId){

      window.location.replace(
        "book-detail.html?google_id=" +
        encodeURIComponent(
          googleBookId
        )
      );

    }

    else{

      message.textContent =
        "Paper Gremlin doesn't know which book you wanted.";

      fallbackLink.hidden =
        false;

    }

  </script>

</body>
</html>
