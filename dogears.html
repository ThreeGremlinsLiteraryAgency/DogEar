<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DogEars · Paper Gremlin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#07110e;--panel:#0c1814;--cream:#f1e7cf;--gold:#d8aa5a;--muted:#a99e89;--line:rgba(216,170,90,.2)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#13251d,#07110e 45%);color:var(--cream);font-family:Georgia,serif;min-height:100vh}.top{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw;gap:28px}.brand{color:var(--cream);text-decoration:none;font-weight:700}.mark{display:inline-grid;place-items:center;width:39px;height:39px;border:1px solid var(--gold);border-radius:50%;margin-right:12px;color:var(--gold)}nav{margin-left:auto;display:flex;gap:22px}nav a{color:#d9cfba;text-decoration:none;font:700 11px Arial;letter-spacing:.1em;text-transform:uppercase}main{width:min(1100px,92vw);margin:48px auto 90px}.kicker{font:700 10px Arial;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}h1{font-size:clamp(44px,6vw,72px);font-weight:400;margin:8px 0}.sub{color:var(--muted);font-size:17px;line-height:1.6}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0}.toolbar button,.btn{border:1px solid var(--line);background:#102019;color:var(--cream);padding:10px 14px;border-radius:8px;cursor:pointer}.toolbar .active{background:var(--gold);color:#17130e}.grid{display:grid;gap:14px}.card{border:1px solid var(--line);background:rgba(12,24,20,.82);padding:20px;border-radius:15px}.meta{color:var(--gold);font:700 10px Arial;letter-spacing:.1em;text-transform:uppercase}.card h2{margin:7px 0;font-size:22px;font-weight:400}.note{white-space:pre-wrap;line-height:1.55}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.danger{color:#e7b0aa}.empty{border:1px dashed var(--line);padding:45px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.box{width:min(620px,96vw);max-height:88vh;overflow:auto;background:#0c1814;border:1px solid var(--line);padding:25px;border-radius:15px}label{display:block;color:var(--gold);font:700 10px Arial;letter-spacing:.1em;text-transform:uppercase;margin:15px 0 6px}input,textarea,select{width:100%;padding:11px;background:#07110e;border:1px solid var(--line);color:var(--cream);border-radius:7px}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:#e7b0aa;margin-top:10px}@media(max-width:760px){nav{display:none}.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><a class="brand" href="dashboard.html"><span class="mark">✦</span>Paper Gremlin</a><nav><a href="dashboard.html">Home</a><a href="discover.html">Discover</a><a href="clubs.html">Clubs</a><a href="reading-tracker.html">Tracker</a><a href="dogears.html">DogEars</a><a href="badges.html">Badges</a></nav></header><main><div class="kicker">Fold the corner</div><h1>DogEars</h1><p class="sub">Save your place and your thoughts without relying on page numbers. Chapter, section, progress, and a short text anchor help the same DogEar make sense across editions.</p><div class="toolbar"><button class="active" data-filter="mine">My DogEars</button><button data-filter="shared">Shared with my clubs</button><button id="newBtn">+ New DogEar</button></div><div id="list" class="grid"></div></main>
<div class="modal" id="modal"><div class="box"><button class="btn" id="close" style="float:right">×</button><div class="kicker">Save a reading place</div><h2 id="formTitle">New DogEar</h2><form id="form"><input type="hidden" id="dogearId"><label>Book</label><select id="book" required></select><div class="row"><div><label>Chapter</label><input id="chapter" maxlength="160" placeholder="Chapter 7"></div><div><label>Section</label><input id="section" maxlength="160" placeholder="The Council"></div></div><label>Progress through book (%)</label><input id="progress" type="number" min="0" max="100" step=".1" placeholder="42"><label>Text anchor</label><input id="anchor" maxlength="500" placeholder="A short phrase near where you stopped"><label>Your note</label><textarea id="note" maxlength="4000" placeholder="What were you thinking here? URLs are not allowed."></textarea><label>Visibility</label><select id="visibility"><option value="private">Private</option><option value="club">Share with a book club</option></select><div id="clubWrap" style="display:none"><label>Book club</label><select id="club"></select></div><div class="error" id="error"></div><div class="actions"><button class="btn" type="submit">Save DogEar</button><button class="btn" type="button" id="cancel">Cancel</button></div></form></div></div>
<script>
const S="https://nrtutxjznkfvvbmaagum.supabase.co",K="sb_publishable_C2t5VVsQQGqHhniETEky6A_XDK1Oycu",sb=supabase.createClient(S,K);let user,items=[],books=[],clubs=[],filter="mine";const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const noUrl=s=>!/(https?:\/\/|www\.|[a-z0-9][a-z0-9.-]*\.(com|net|org|io|co|us|uk|ca|edu|gov)(\/|\s|$))/i.test(s||"");
async function init(){const {data:{user:u}}=await sb.auth.getUser();if(!u){location.href="auth.html";return}user=u;const [{data:b},{data:cm}]=await Promise.all([sb.from("books").select("id,title,authors").order("title").limit(1000),sb.from("club_members").select("club_id,clubs(id,name)").eq("user_id",u.id).eq("membership_status","active").is("banned_at",null)]);books=b||[];clubs=(cm||[]).map(x=>x.clubs).filter(Boolean);$("book").innerHTML='<option value="">Choose a book…</option>'+books.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join("");$("club").innerHTML=clubs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");await load()}
async function load(){let q=sb.from("dogears").select("id,user_id,book_id,chapter_label,section_label,progress_percent,anchor_text,note_text,visibility,club_id,created_at,updated_at,books(title,authors),clubs(name)").order("created_at",{ascending:false});if(filter==="mine")q=q.eq("user_id",user.id);else q=q.eq("visibility","club").eq("is_hidden",false);const {data,error}=await q;if(error){$("list").innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}items=data||[];render()}
function render(){if(!items.length){$("list").innerHTML='<div class="empty">'+(filter==="mine"?"No DogEars yet. Fold your first corner.":"No shared DogEars from your clubs yet.")+'</div>';return}$("list").innerHTML=items.map(x=>{const own=x.user_id===user.id,loc=[x.chapter_label,x.section_label,x.progress_percent!=null?x.progress_percent+"%":""].filter(Boolean).join(" · ");return '<article class="card"><div class="meta">'+esc(x.visibility==="club"?(x.clubs?.name||"Shared DogEar"):"Private DogEar")+'</div><h2>'+esc(x.books?.title||"Book")+'</h2><div class="muted">'+esc(loc||"Saved reading place")+'</div>'+(x.anchor_text?'<p>“'+esc(x.anchor_text)+'”</p>':'')+(x.note_text?'<div class="note">'+esc(x.note_text)+'</div>':'')+(own?'<div class="actions"><button class="btn edit" data-id="'+x.id+'">Edit</button><button class="btn danger del" data-id="'+x.id+'">Delete</button></div>':'')+'</article>'}).join("");document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>edit(Number(b.dataset.id)));document.querySelectorAll(".del").forEach(b=>b.onclick=()=>removeDogEar(Number(b.dataset.id)))}
function openForm(){ $("form").reset();$("dogearId").value="";$("formTitle").textContent="New DogEar";$("clubWrap").style.display="none";$("error").textContent="";$("modal").classList.add("show")}
function edit(id){const x=items.find(y=>y.id===id);if(!x)return;$("dogearId").value=x.id;$("book").value=x.book_id||"";$("chapter").value=x.chapter_label||"";$("section").value=x.section_label||"";$("progress").value=x.progress_percent??"";$("anchor").value=x.anchor_text||"";$("note").value=x.note_text||"";$("visibility").value=x.visibility;$("club").value=x.club_id||"";$("clubWrap").style.display=x.visibility==="club"?"block":"none";$("formTitle").textContent="Edit DogEar";$("error").textContent="";$("modal").classList.add("show")}
async function save(e){e.preventDefault();$("error").textContent="";if(!noUrl($("note").value)||!noUrl($("anchor").value)){$("error").textContent="DogEars cannot contain URLs.";return}const vis=$("visibility").value,clubId=vis==="club"?Number($("club").value)||null:null;if(vis==="club"&&!clubId){$("error").textContent="Choose a club to share with.";return}const row={user_id:user.id,book_id:Number($("book").value),chapter_label:$("chapter").value.trim()||null,section_label:$("section").value.trim()||null,progress_percent:$("progress").value===""?null:Number($("progress").value),anchor_text:$("anchor").value.trim()||null,note_text:$("note").value.trim()||null,visibility:vis,club_id:clubId};const id=$("dogearId").value;const {error}=id?await sb.from("dogears").update(row).eq("id",Number(id)):await sb.from("dogears").insert(row);if(error){$("error").textContent=error.message;return}$("modal").classList.remove("show");await load()}
async function removeDogEar(id){if(!confirm("Delete this DogEar?"))return;const {error}=await sb.from("dogears").delete().eq("id",id);if(error){alert(error.message);return}await load()}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));load()});$("newBtn").onclick=openForm;$("close").onclick=$("cancel").onclick=()=>$("modal").classList.remove("show");$("visibility").onchange=()=>$("clubWrap").style.display=$("visibility").value==="club"?"block":"none";$("form").onsubmit=save;init();
</script></body></html>
