<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DogEar — Book Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --ink:#090b0a;
  --ink2:#0d100e;
  --panel:#101410;
  --panel2:#151a15;
  --cream:#f1e7cf;
  --cream2:#d9cfb8;
  --gold:#c79b59;
  --gold2:#dfbd7e;
  --green:#26362b;
  --green2:#34483a;
  --muted:#aaa18f;
  --line:rgba(199,155,89,.22);
  --line-soft:rgba(199,155,89,.11);
  --danger:#e6a09a;
  --ok:#b9d6b2;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  background:
    radial-gradient(
      circle at 8% 0%,
      rgba(53,73,59,.28),
      transparent 26%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(199,155,89,.07),
      transparent 24%
    ),
    var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}

body.loading-lock{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  color:inherit;
}

a{
  color:inherit;
}

.topbar{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:0 clamp(18px,4vw,60px);
  border-bottom:1px solid var(--line);
  background:rgba(9,11,10,.95);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  color:var(--gold2);
  text-decoration:none;
  font:800 13px Arial,sans-serif;
  letter-spacing:.17em;
  text-transform:uppercase;
  white-space:nowrap;
}

.brand-mark{
  width:34px;
  height:34px;
  border:1px solid var(--gold);
  border-radius:50% 50% 50% 12%;
  transform:rotate(-8deg);
  position:relative;
}

.brand-mark::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
  right:7px;
  top:7px;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  font:700 11px Arial,sans-serif;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.nav a{
  color:var(--muted);
  text-decoration:none;
  transition:.16s ease;
}

.nav a:hover,
.nav a.active{
  color:var(--gold2);
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-link{
  display:none;
  min-height:36px;
  padding:0 13px;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--gold2);
  text-decoration:none;
  font:800 9px Arial,sans-serif;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.admin-link.show{
  display:flex;
}

.avatar{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:var(--green);
  text-decoration:none;
  font:800 13px Arial,sans-serif;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.page{
  width:min(1320px,calc(100% - 32px));
  margin:auto;
  padding:46px 0 110px;
}

.hero{
  min-height:380px;
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);
  align-items:stretch;
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      rgba(38,54,43,.76),
      rgba(16,20,16,.9) 58%,
      rgba(199,155,89,.06)
    );
}

.hero-copy{
  padding:clamp(34px,6vw,76px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.eyebrow{
  margin-bottom:14px;
  color:var(--gold);
  font:800 10px Arial,sans-serif;
  letter-spacing:.19em;
  text-transform:uppercase;
}

h1{
  margin:0;
  max-width:760px;
  font-size:clamp(50px,7vw,92px);
  line-height:.91;
  font-weight:400;
  letter-spacing:-.055em;
}

.hero-description{
  max-width:680px;
  margin:22px 0 0;
  color:var(--cream2);
  font:14px/1.75 Arial,sans-serif;
}

.hero-actions{
  margin-top:28px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.primary-button,
.secondary-button{
  min-height:45px;
  padding:0 18px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  cursor:pointer;
  font:800 9px Arial,sans-serif;
  letter-spacing:.09em;
  text-transform:uppercase;
  transition:.18s ease;
}

.primary-button{
  border:1px solid var(--gold);
  background:var(--gold);
  color:#11130f;
}

.primary-button:hover{
  background:var(--gold2);
  border-color:var(--gold2);
}

.secondary-button{
  border:1px solid var(--line);
  background:rgba(9,11,10,.35);
  color:var(--gold2);
}

.secondary-button:hover{
  border-color:var(--gold);
}

.hero-art{
  position:relative;
  min-height:380px;
  border-left:1px solid var(--line);
  overflow:hidden;
}

.hero-art::before,
.hero-art::after{
  content:"";
  position:absolute;
  border:1px solid rgba(199,155,89,.35);
  background:rgba(9,11,10,.22);
  box-shadow:0 30px 70px rgba(0,0,0,.35);
}

.hero-art::before{
  width:155px;
  height:235px;
  left:18%;
  top:21%;
  transform:rotate(-10deg);
}

.hero-art::after{
  width:170px;
  height:255px;
  right:12%;
  top:12%;
  transform:rotate(9deg);
}

.hero-book{
  position:absolute;
  width:165px;
  height:245px;
  left:42%;
  top:28%;
  transform:translate(-50%,-5%) rotate(2deg);
  z-index:3;
  border:1px solid var(--gold);
  background:
    linear-gradient(
      145deg,
      var(--green2),
      #141915
    );
  box-shadow:0 34px 80px rgba(0,0,0,.5);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.hero-book-small{
  color:var(--gold);
  font:800 8px Arial,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.hero-book-title{
  font-size:31px;
  line-height:.92;
}

.hero-book-foot{
  color:var(--muted);
  font:9px Arial,sans-serif;
}

.search-shell{
  margin-top:26px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(16,20,16,.86);
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
}

.search-wrap{
  position:relative;
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font:800 12px Arial,sans-serif;
}

.search-input{
  width:100%;
  min-height:50px;
  padding:0 16px 0 43px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:#0b0e0c;
  color:var(--cream);
  font:13px Arial,sans-serif;
}

.search-input:focus{
  border-color:var(--gold);
}

.search-input::placeholder{
  color:#746e62;
}

.search-meta{
  min-width:150px;
  text-align:right;
  color:var(--muted);
  font:10px Arial,sans-serif;
}

.section{
  margin-top:54px;
}

.section.hidden{
  display:none;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:18px;
}

.section-kicker{
  margin-bottom:7px;
  color:var(--gold);
  font:800 9px Arial,sans-serif;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.section-title{
  margin:0;
  font-size:clamp(28px,4vw,42px);
  font-weight:400;
  letter-spacing:-.025em;
}

.section-description{
  max-width:560px;
  margin-top:7px;
  color:var(--muted);
  font:11px/1.6 Arial,sans-serif;
}

.section-count{
  flex:0 0 auto;
  color:var(--muted);
  font:10px Arial,sans-serif;
}

.book-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:18px;
}

.book-card{
  min-width:0;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(16,20,16,.88);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:.2s ease;
}

.book-card:hover{
  transform:translateY(-3px);
  border-color:rgba(199,155,89,.55);
  box-shadow:0 24px 50px rgba(0,0,0,.22);
}

.book-cover-link{
  display:block;
  text-decoration:none;
}

.book-cover{
  position:relative;
  aspect-ratio:2 / 3;
  overflow:hidden;
  background:
    linear-gradient(
      145deg,
      #29382d,
      #111512
    );
  border-bottom:1px solid var(--line-soft);
}

.book-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .25s ease;
}

.book-card:hover .book-cover img{
  transform:scale(1.025);
}

.cover-placeholder{
  width:100%;
  height:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:
    linear-gradient(
      145deg,
      rgba(199,155,89,.11),
      rgba(38,54,43,.72)
    );
}

.placeholder-brand{
  color:var(--gold);
  font:800 8px Arial,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.placeholder-title{
  font-size:clamp(19px,2vw,29px);
  line-height:.95;
  overflow-wrap:anywhere;
}

.book-badges{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:2;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  pointer-events:none;
}

.book-badge{
  padding:6px 8px;
  border-radius:999px;
  border:1px solid rgba(199,155,89,.45);
  background:rgba(9,11,10,.88);
  color:var(--gold2);
  font:800 7px Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  backdrop-filter:blur(8px);
}

.book-info{
  padding:15px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.book-title-link{
  color:var(--cream);
  text-decoration:none;
}

.book-title{
  margin:0;
  font-size:19px;
  line-height:1.05;
  font-weight:400;
  overflow-wrap:anywhere;
}

.book-title-link:hover{
  color:var(--gold2);
}

.book-author{
  margin-top:7px;
  color:var(--muted);
  font:10px/1.45 Arial,sans-serif;
  min-height:29px;
}

.book-meta{
  margin-top:11px;
  color:#7f786b;
  font:9px/1.5 Arial,sans-serif;
}

.book-actions{
  margin-top:auto;
  padding-top:15px;
  display:grid;
  gap:8px;
}

.book-action{
  min-height:38px;
  width:100%;
  padding:0 11px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  font:800 8px Arial,sans-serif;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.book-action.details{
  border:1px solid var(--line);
  color:var(--gold2);
  background:transparent;
}

.book-action.buy{
  border:1px solid var(--gold);
  background:var(--gold);
  color:#11130f;
}

.book-action.buy:hover{
  background:var(--gold2);
  border-color:var(--gold2);
}

.book-action.unavailable{
  border:1px solid var(--line-soft);
  color:#6f695f;
  cursor:default;
  background:transparent;
}

.empty-state{
  grid-column:1 / -1;
  padding:55px 25px;
  border:1px dashed var(--line);
  border-radius:18px;
  text-align:center;
  background:rgba(16,20,16,.45);
}

.empty-state strong{
  display:block;
  margin-bottom:8px;
  color:var(--cream);
  font-size:22px;
  font-weight:400;
}

.empty-state span{
  color:var(--muted);
  font:11px/1.6 Arial,sans-serif;
}

.catalog-toolbar{
  display:flex;
  gap:10px;
  align-items:center;
}

.sort-select{
  min-height:38px;
  padding:0 34px 0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#0b0e0c;
  color:var(--cream2);
  outline:none;
  font:800 9px Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.reward-shell{
  border:1px solid var(--line);
  border-radius:24px;
  padding:clamp(22px,4vw,36px);
  background:
    linear-gradient(
      145deg,
      rgba(38,54,43,.48),
      rgba(16,20,16,.9)
    );
}

.reward-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.reward-card{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:rgba(9,11,10,.45);
}

.reward-image{
  aspect-ratio:1.25 / 1;
  background:
    linear-gradient(
      145deg,
      rgba(199,155,89,.1),
      rgba(38,54,43,.75)
    );
  display:grid;
  place-items:center;
  overflow:hidden;
}

.reward-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reward-placeholder{
  color:var(--gold2);
  font-size:36px;
}

.reward-body{
  padding:16px;
}

.reward-type{
  color:var(--gold);
  font:800 8px Arial,sans-serif;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.reward-title{
  margin-top:6px;
  font-size:20px;
  line-height:1.05;
}

.reward-description{
  margin-top:8px;
  color:var(--muted);
  font:10px/1.55 Arial,sans-serif;
}

.reward-footer{
  margin-top:16px;
  padding-top:13px;
  border-top:1px solid var(--line-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.coin-price{
  color:var(--gold2);
  font:800 12px Arial,sans-serif;
}

.reward-status{
  color:var(--muted);
  font:9px Arial,sans-serif;
}

.marketplace-foot{
  margin-top:65px;
  padding-top:26px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:30px;
  color:var(--muted);
  font:10px/1.6 Arial,sans-serif;
}

.marketplace-foot strong{
  color:var(--cream2);
}

.loading-screen{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  background:var(--ink);
  transition:opacity .2s ease;
}

.loading-screen.hidden{
  opacity:0;
  pointer-events:none;
}

.loading-inner{
  text-align:center;
}

.loading-mark{
  width:48px;
  height:48px;
  margin:0 auto 18px;
  border:1px solid var(--gold);
  border-radius:50% 50% 50% 12%;
  animation:floatMark 1.5s ease-in-out infinite;
}

.loading-text{
  color:var(--gold2);
  font:800 10px Arial,sans-serif;
  letter-spacing:.16em;
  text-transform:uppercase;
}

@keyframes floatMark{
  0%,100%{
    transform:translateY(0) rotate(-8deg);
  }
  50%{
    transform:translateY(-6px) rotate(-8deg);
  }
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:150;
  max-width:360px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#111512;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  color:var(--cream2);
  font:11px/1.5 Arial,sans-serif;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.18s ease;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.error{
  border-color:rgba(230,160,154,.4);
  color:var(--danger);
}

@media(max-width:1120px){

  .book-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .reward-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}

@media(max-width:900px){

  .hero{
    grid-template-columns:1fr;
  }

  .hero-art{
    display:none;
  }

  .book-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .reward-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}

@media(max-width:720px){

  .nav{
    display:none;
  }

  .page{
    width:min(100% - 24px,1320px);
    padding-top:24px;
  }

  .hero-copy{
    padding:38px 25px;
  }

  .search-shell{
    grid-template-columns:1fr;
  }

  .search-meta{
    text-align:left;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
    gap:10px;
  }

  .catalog-toolbar{
    width:100%;
  }

  .sort-select{
    width:100%;
  }

  .book-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .marketplace-foot{
    flex-direction:column;
  }

}

@media(max-width:460px){

  .brand{
    font-size:11px;
  }

const SUPABASE_PUBLISHABLE_KEY =

const BOOKSHOP_AFFILIATE_ID =
  "128186";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentUser =
  null;

let currentProfile =
  null;

let isSiteAdmin =
  false;

let marketplaceBooks =
  [];

let filteredBooks =
  [];

  false;

let currentCoinBalance =
  null;

let rewardItems =
  [];

let searchTimer =

/* =========================================================
   DOM HELPERS
   ========================================================= */

const $ =
  id =>
    document.getElementById(id);

function showToast(
  message,
  type = ""
){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.className =
    "toast" +
    (
      type
        ? ` ${type}`
        : ""
    );

  requestAnimationFrame(
    () => {

      toast.classList.add(
        "show"
      );

    }
  );

  window.clearTimeout(
    showToast.timer
  );

  showToast.timer =
    window.setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3400
    );

}

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

function normalizeText(
  value
){

  return String(
    value ?? ""
  )
    .trim()
    .toLowerCase();

}

function normalizeBoolean(
  value
){

  return (
    value === true ||
    value === 1 ||
    value === "1" ||
    value === "true"
  );

}

function safeNumber(
  value,
  fallback = 0
){

  const number =
    Number(value);

  return Number.isFinite(
    number
  )
    ? number
    : fallback;

}

function uniqueStrings(
  values
){

  return [
    ...new Set(
      values
        .map(
          value =>
            String(
              value ?? ""
            ).trim()
        )
        .filter(Boolean)
    )
  ];

}

function parseArray(
  value
){

  if(
    Array.isArray(value)
  ){

    return value
      .filter(Boolean);

  }

  if(
    typeof value === "string" &&
    value.trim()
  ){

    try{

      const parsed =
        JSON.parse(value);

      if(
        Array.isArray(parsed)
      ){

        return parsed
          .filter(Boolean);

      }

    }
    catch(error){
      /* use comma parsing below */
    }

    return value
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean);

  }

  return [];

}

function initials(
  value
){

  const words =
    String(
      value ||
      "DogEar"
    )
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(
    !words.length
  ){
    return "D";
  }

  return words
    .slice(0,2)
    .map(
      word =>
        word.charAt(0)
    )
    .join("")
    .toUpperCase();

}

function formatBookCount(
  count
){

  return `${count} ${
    count === 1
      ? "book"
      : "books"
  }`;

}

function formatCoinCount(
  count
){

  const value =
    safeNumber(
      count,
      0
    );

  return `${value.toLocaleString()} ${
    value === 1
      ? "coin"
      : "coins"
  }`;

}

function normalizeDateValue(
  value
){

  if(
    !value
  ){
    return 0;
  }

  const date =
    new Date(value);

  return Number.isNaN(
    date.getTime()
  )
    ? 0
    : date.getTime();

}

/* =========================================================
   BOOK NORMALIZATION
   ========================================================= */

function normalizeBook(
  row
){

  const authors =
    uniqueStrings(
      parseArray(
        row.authors ||
        row.author
      )
    );

  const categories =
    uniqueStrings(
      parseArray(
        row.categories
      )
    );

  const title =
    String(
      row.title ||
      "Untitled"
    ).trim();

  const authorText =
    authors.length
      ? authors.join(", ")
      : String(
          row.author ||
          "Unknown author"
        );

  const isbn13 =
    String(
      row.isbn13 ||
      row.isbn_13 ||
      ""
    ).trim();

  const isbn10 =
    String(
      row.isbn10 ||
      row.isbn_10 ||
      ""
    ).trim();

  const createdAt =
    row.created_at ||
    row.added_at ||
    row.updated_at ||
    "";

  const publishedDate =
    row.published_date ||
    row.publishedDate ||
    "";

  const popularity =
    safeNumber(
      row.popularity_score ??
      row.popularity ??
      row.views_last_6_months ??
      row.marketplace_views ??
      row.vote_count ??
      0
    );

  return {

    id:
      row.id,

    title,

    authors,

    authorText,

    publisher:
      String(
        row.publisher ||
        ""
      ).trim(),

    description:
      String(
        row.description ||
        ""
      ).trim(),

    thumbnail:
      String(
        row.thumbnail ||
        row.cover_url ||
        row.image_url ||
        ""
      ).trim(),

    isbn13,

    isbn10,

    categories,

    publishedDate,

    createdAt,

    featured:
      normalizeBoolean(
        row.featured ??
        row.is_featured
      ),

    staffPick:
      normalizeBoolean(
        row.staff_pick ??
        row.is_staff_pick
      ),

    newNoteworthy:
      normalizeBoolean(
        row.new_noteworthy ??
        row.is_new_noteworthy
      ),

    active:
      row.active === undefined
        ? true
        : normalizeBoolean(
            row.active
          ),

    marketplaceActive:
      row.marketplace_active === undefined
        ? true
        : normalizeBoolean(
            row.marketplace_active
          ),

    popularity,

    bookshopUrl:
      String(
        row.bookshop_url ||
        row.affiliate_url ||
        ""
      ).trim(),

    googleBooksId:
      String(
        row.google_books_id ||
        row.google_id ||
        ""
      ).trim()

  };

}

async function loadMarketplaceBooks(){

  marketplaceBooks =
    [];

  try{

    let data =
      null;

    let error =
      null;

    const marketplaceQuery =
      await supabaseClient
        .from("marketplace_items")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    data =
      marketplaceQuery.data;

    error =
      marketplaceQuery.error;

    if(
      error
    ){

      console.warn(
        "marketplace_items load failed; trying books table:",
        error
      );

      const fallbackQuery =
        await supabaseClient
          .from("books")
          .select("*")
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      data =
        fallbackQuery.data;

      error =
        fallbackQuery.error;

    }

    if(
      error
    ){
      throw error;
    }

    marketplaceBooks =
      (
        data ||
        []
      )
        .map(
          normalizeBook
        )
        .filter(
          book =>
            book.active &&
            book.marketplaceActive
        );

    filteredBooks =
      [
        ...marketplaceBooks
      ];

  }
  catch(error){

    console.error(
      "Marketplace books:",
      error
    );

    marketplaceBooks =
      [];

    filteredBooks =
      [];

    showToast(
      "DogEar couldn't load the marketplace books.",
      "error"
    );

  }

  renderMarketplace();

}

   BOOKSHOP LINKS
   ========================================================= */

function buildBookshopUrl(
  book
){

  if(
    book.bookshopUrl
  ){

    const existing =
      new URL(
        book.bookshopUrl,
        window.location.href
      );

    if(
      existing.hostname.includes(
        "bookshop.org"
      )
    ){

      existing.searchParams.set(
        "a",
        BOOKSHOP_AFFILIATE_ID
      );

      return existing.toString();

    }

  }

  const searchValue =
    book.isbn13 ||
    book.isbn10 ||
    [
      book.title,
      book.authors[0]
    ]
      .filter(Boolean)
      .join(" ");

  return (
    "https://bookshop.org/search" +
    "?keywords=" +
    encodeURIComponent(
      searchValue
    ) +
    "&a=" +
    encodeURIComponent(
      BOOKSHOP_AFFILIATE_ID
    )
  );

}

function buildBookDetailUrl(
  book
){

  if(
    book.id
  ){

    return (

  if(
    book.googleBooksId
  ){

    return (
      "book-detail.html?google_id=" +

    );

  }

}

   ========================================================= */

function createBookCard(
  book
){

  const article =
    document.createElement(
      "article"
    );

  article.className =
    "book-card";

  const detailUrl =
    buildBookDetailUrl(
      book
    );

  const buyUrl =
    buildBookshopUrl(
      book
    );

  const badges =
    [];

  if(
    book.featured
  ){
    badges.push(
      "Featured"
    );
  }

  if(
    book.staffPick
  ){
    badges.push(
      "Staff Pick"
    );
  }

  if(
    book.newNoteworthy
  ){
    badges.push(
      "New"
    );
  }

  const badgeHtml =
    badges.length
      ? `
        <div class="book-badges">
          ${badges
            .map(
              badge =>
                `
                  <span class="book-badge">
                    ${escapeHtml(badge)}
                  </span>
                `
            )
            .join("")
          }
        </div>
      `
      : "";

  const coverHtml =
    book.thumbnail
      ? `
        <img
          src="${escapeHtml(
            book.thumbnail.replace(
              /^http:/,
              "https:"
            )
          )}"
          alt="${escapeHtml(
            book.title
          )} cover"
          loading="lazy"
        >
      `
      : `
        <div class="cover-placeholder">

          <div class="placeholder-brand">
            DogEar
          </div>

          <div class="placeholder-title">
            ${escapeHtml(
              book.title
            )}
          </div>

        </div>
      `;

  const metaParts =
    [];

  if(
    book.publisher
  ){
    metaParts.push(
      book.publisher
    );
  }

  if(
    book.publishedDate
  ){
    metaParts.push(
      book.publishedDate
    );
  }

  article.innerHTML =
    `
      <a
        class="book-cover-link"
        href="${escapeHtml(
          detailUrl
        )}"
      >

        <div class="book-cover">

          ${badgeHtml}

          ${coverHtml}

        </div>

      </a>

      <div class="book-info">

        <a
          class="book-title-link"
          href="${escapeHtml(
            detailUrl
          )}"
        >

          <h3 class="book-title">
            ${escapeHtml(
              book.title
            )}
          </h3>

        </a>

        <div class="book-author">
          ${escapeHtml(
            book.authorText
          )}
        </div>

        <div class="book-meta">
          ${
            metaParts.length
              ? escapeHtml(
                  metaParts.join(
                    " · "
                  )
                )
              : "&nbsp;"
          }
        </div>

        <div class="book-actions">

          <a
            class="book-action details"
            href="${escapeHtml(
              detailUrl
            )}"
          >
            Book Details
          </a>

          <a
            class="book-action buy"
            href="${escapeHtml(
              buyUrl
            )}"
            target="_blank"
            rel="noopener sponsored"
          >
            Buy on Bookshop.org
          </a>

        </div>

      </div>
    `;

  return article;

}

   ========================================================= */

function renderMarketplace(){

  const query =
    normalizeText(
      $("marketplaceSearch")
        ?.value
    );

  const sort =
    $("sortSelect")
      ?.value ||
    "featured";

  filteredBooks =
    marketplaceBooks.filter(
      book => {

        if(
          !query
        ){
          return true;
        }

        const searchable =
          normalizeText(
            [
              book.title,
              book.authorText,
              book.publisher,
              book.isbn13,
              book.isbn10,
              ...book.categories
            ]
              .filter(Boolean)
              .join(" ")
          );

        return searchable.includes(
          query
        );

      }
    );

  filteredBooks =
    sortBooks(
      filteredBooks,
      sort
    );

  renderFeaturedBooks();

  renderPopularBooks();

  renderAllBooks();

  updateSearchMeta();

}


function sortBooks(
  books,
  sort
){

  const sorted =
    [
      ...books
    ];

  switch(
    sort
  ){

    case "newest":

      sorted.sort(
        (
          a,
          b
        ) =>
          normalizeDateValue(
            b.createdAt
          ) -
          normalizeDateValue(
            a.createdAt
          )
      );

      break;


    case "title":

      sorted.sort(
        (
          a,
          b
        ) =>
          a.title.localeCompare(
            b.title,
            undefined,
            {
              sensitivity:"base"
            }
          )
      );

      break;


    case "author":

      sorted.sort(
        (
          a,
          b
        ) =>
          a.authorText.localeCompare(
            b.authorText,
            undefined,
            {
              sensitivity:"base"
            }
          )
      );

      break;


    case "popular":

      sorted.sort(
        (
          a,
          b
        ) =>
          b.popularity -
          a.popularity
      );

      break;


    case "featured":
    default:

      sorted.sort(
        (
          a,
          b
        ) => {

          const featuredDifference =
            Number(
              b.featured
            ) -
            Number(
              a.featured
            );

          if(
            featuredDifference
          ){
            return featuredDifference;
          }

          const staffDifference =
            Number(
              b.staffPick
            ) -
            Number(
              a.staffPick
            );

          if(
            staffDifference
          ){
            return staffDifference;
          }

          const popularityDifference =
            b.popularity -
            a.popularity;

          if(
            popularityDifference
          ){
            return popularityDifference;
          }

          return (
            normalizeDateValue(
              b.createdAt
            ) -
            normalizeDateValue(
              a.createdAt
            )
          );

        }
      );

      break;

  }

  return sorted;

}


function renderBookGrid(
  holder,
  books,
  emptyTitle,
  emptyText
){

  holder.innerHTML =
    "";

  if(
    !books.length
  ){

    holder.innerHTML =
      `
        <div class="empty-state">

          <strong>
            ${escapeHtml(
              emptyTitle
            )}
          </strong>

          <span>
            ${escapeHtml(
              emptyText
            )}
          </span>

        </div>
      `;

    return;

  }

  const fragment =
    document.createDocumentFragment();

  books.forEach(
    book => {

      fragment.appendChild(
        createBookCard(
          book
        )
      );

    }
  );

  holder.appendChild(
    fragment
  );

}

    const primaryQuery =
      await supabaseClient
        .from("coin_marketplace_items")
        .select("*")
        .eq(
          "active",
          true
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );

    data =
      primaryQuery.data;

    error =
      primaryQuery.error;

    if(
      error
    ){

      console.warn(
        "coin_marketplace_items unavailable; trying marketplace_items:",
        error
      );

      const fallbackQuery =
        await supabaseClient
          .from("marketplace_items")
          .select("*")
          .eq(
            "item_type",
            "coin_reward"
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      data =
        fallbackQuery.data;

      error =
        fallbackQuery.error;

    }

    if(
      error
    ){
      throw error;
    }

    rewardItems =
      (
        data ||
        []
      )
        .filter(
          row =>
            row.active === undefined ||
            normalizeBoolean(
              row.active
            )
        )
        .map(
          row => ({

            id:
              row.id,

            title:
              String(
                row.title ||
                row.name ||
                "DogEar Reward"
              ).trim(),

            description:
              String(
                row.description ||
                ""
              ).trim(),

            imageUrl:
              String(
                row.image_url ||
                row.thumbnail ||
                ""
              ).trim(),

            type:
              String(
                row.reward_type ||
                row.item_type ||
                "Reward"
              ).trim(),

            coinCost:
              safeNumber(
                row.coin_cost ??
                row.price_coins ??
                row.coins ??
                0
              ),

            inventory:
              row.inventory === null ||
              row.inventory === undefined
                ? null
                : safeNumber(
                    row.inventory,
                    0
                  ),

            redeemable:
              row.redeemable === undefined
                ? true
                : normalizeBoolean(
                    row.redeemable
                  )

          })
        );

  }
  catch(error){

    console.warn(
      "Coin marketplace items:",
      error
    );

    rewardItems =
      [];

  }

  renderRewardItems();

}


function renderRewardItems(){

  const holder =
    $("rewardGrid");

  if(
    !holder
  ){
    return;
  }

  holder.innerHTML =
    "";

  if(
    !coinMarketplaceEnabled
  ){
    return;
  }

  if(
    !rewardItems.length
  ){

    holder.innerHTML =
      `
        <div class="empty-state">

          <strong>
            Coin rewards are coming.
          </strong>

          <span>
            DogEar rewards will appear here when they are available.
          </span>

        </div>
      `;

    return;

  }

  const fragment =
    document.createDocumentFragment();

  rewardItems.forEach(
    item => {

      const article =
        document.createElement(
          "article"
        );

      article.className =
        "reward-card";

      const imageHtml =
        item.imageUrl
          ? `
            <img
              src="${escapeHtml(
                item.imageUrl
              )}"
              alt="${escapeHtml(
                item.title
              )}"
              loading="lazy"
            >
          `
          : `
            <div class="reward-placeholder">
              ◇
            </div>
          `;

      let statusText =
        "Available";

      if(
        !item.redeemable
      ){

        statusText =
          "Unavailable";

      }
      else if(
        item.inventory !== null &&
        item.inventory <= 0
      ){

        statusText =
          "Out of stock";

      }
      else if(
        item.inventory !== null
      ){

        statusText =
          `${item.inventory} remaining`;

      }

      article.innerHTML =
        `
          <div class="reward-image">
            ${imageHtml}
          </div>

          <div class="reward-body">

            <div class="reward-type">
              ${escapeHtml(
                item.type
              )}
            </div>

            <div class="reward-title">
              ${escapeHtml(
                item.title
              )}
            </div>

            <div class="reward-description">
              ${
                item.description
                  ? escapeHtml(
                      item.description
                    )
                  : "A DogEar coin reward."
              }
            </div>

            <div class="reward-footer">

              <span class="coin-price">
                ${escapeHtml(
                  formatCoinCount(
                    item.coinCost
                  )
                )}
              </span>

              <span class="reward-status">
                ${escapeHtml(
                  statusText
                )}
              </span>

            </div>

          </div>
        `;

      fragment.appendChild(
        article
      );

    }
  );

  holder.appendChild(
    fragment
  );

}


/* =========================================================
   SEARCH
   ========================================================= */

function handleSearchInput(){

  window.clearTimeout(
    searchTimer
  );

  searchTimer =
    window.setTimeout(
      () => {

        renderMarketplace();

      },
      120
    );

}


/* =========================================================
   EVENTS
   ========================================================= */

function bindEvents(){

  $("marketplaceSearch")
    ?.addEventListener(
      "input",
      handleSearchInput
    );

  $("sortSelect")
    ?.addEventListener(
      "change",
      renderMarketplace
    );

}


/* =========================================================
   AUTH STATE CHANGE
   ========================================================= */

function bindAuthStateChange(){

  supabaseClient
    .auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        currentUser =
          session?.user ||
          null;

        currentProfile =
          null;

        isSiteAdmin =
          false;

        if(
          currentUser
        ){

          await Promise.all([
            loadCurrentProfile(),
            loadAdminState()
          ]);

        }
        else{

          renderLoggedOutNavigation();

        }

        await loadCoinBalance();

      }
    );

}


/* =========================================================
   LOADING SCREEN
   ========================================================= */

function hideLoadingScreen(){

  const loading =
    $("loadingScreen");

  document.body.classList.remove(
    "loading-lock"
  );

  loading?.classList.add(
    "hidden"
  );

  window.setTimeout(
    () => {

      if(
        loading
      ){
        loading.style.display =
          "none";
      }

    },
    250
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

  bindEvents();

  bindAuthStateChange();

  try{

    await loadSession();

    await loadMarketplaceSettings();

    await Promise.all([
      loadMarketplaceBooks(),
      loadCoinBalance(),
      loadRewardItems()
    ]);

  }
  catch(error){

    console.error(
      "Marketplace initialization:",
      error
    );

    showToast(
      "DogEar couldn't completely load the marketplace.",
      "error"
    );

  }
  finally{

    hideLoadingScreen();

  }

}


/* =========================================================
   START
   ========================================================= */

initialize();

</script>
