<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DogEar — Club Bookshelf</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --ink:#090b0a;
  --panel:#101410;
  --panel2:#0d110e;
  --cream:#f1e7cf;
  --gold:#c79b59;
  --gold2:#dfbd7e;
  --green:#26362b;
  --muted:#aaa18f;
  --line:rgba(199,155,89,.22);
  --line-soft:rgba(199,155,89,.11);
  --danger:#e6a09a;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--cream);
  background:
    radial-gradient(circle at 10% 0%,rgba(53,73,59,.24),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(199,155,89,.08),transparent 24%),
    var(--ink);
  font-family:Georgia,"Times New Roman",serif;
}

a{color:inherit}

.topbar{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:0 clamp(18px,4vw,60px);
  border-bottom:1px solid var(--line);
  background:rgba(9,11,10,.94);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  gap:11px;
  align-items:center;
  text-decoration:none;
  color:var(--gold2);
  font:800 13px Arial;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.brand-mark{
  width:34px;
  height:34px;
  border:1px solid var(--gold);
  border-radius:50% 50% 50% 12%;
  transform:rotate(-8deg);
  position:relative;
}

.brand-mark::after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  right:2px;
  top:2px;
  border-left:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
  background:var(--ink);
}

.nav{
  display:flex;
  gap:24px;
  font:700 11px Arial;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.nav a{
  color:var(--muted);
  text-decoration:none;
}

.nav a:hover,
.nav .active{
  color:var(--gold2);
}

.avatar{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--green);
  color:var(--gold2);
  text-decoration:none;
  font:800 13px Arial;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.page{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
  padding:36px 0 100px;
}

.back{
  color:var(--gold2);
  text-decoration:none;
  font:800 10px Arial;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.club-head{
  margin:24px 0 22px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  color:var(--gold);
  font:800 10px Arial;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:9px;
}

h1{
  font-size:clamp(42px,6vw,68px);
  font-weight:400;
  line-height:.96;
  letter-spacing:-.035em;
  margin:0;
}

.club-sub{
  color:var(--muted);
  font:13px/1.6 Arial;
  margin-top:12px;
}

.club-nav{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:26px;
}

.club-nav a{
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  text-decoration:none;
  font:800 9px Arial;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.club-nav a:hover,
.club-nav a.active{
  color:var(--gold2);
  border-color:var(--gold);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.search{
  width:min(420px,100%);
  height:44px;
  border:1px solid rgba(199,155,89,.2);
  border-radius:12px;
  background:var(--panel2);
  color:var(--cream);
  outline:none;
  padding:0 14px;
  font:13px Arial;
}

.search:focus{
  border-color:var(--gold);
}

.shelf-summary{
  color:var(--muted);
  font:10px Arial;
  letter-spacing:.04em;
}

.shelf{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.book-card{
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:rgba(16,20,16,.88);
  box-shadow:0 18px 50px rgba(0,0,0,.22);
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.book-card.current{
  border-color:rgba(199,155,89,.6);
  box-shadow:
    0 18px 50px rgba(0,0,0,.22),
    0 0 0 1px rgba(199,155,89,.08);
}

.book-card.clickable{
  cursor:pointer;
}

.book-card.clickable:hover{
  transform:translateY(-4px);
  border-color:rgba(199,155,89,.55);
  box-shadow:0 24px 60px rgba(0,0,0,.34);
}

.book-card.clickable:focus{
  outline:2px solid var(--gold);
  outline-offset:3px;
}

.cover{
  aspect-ratio:2/3;
  background:#171c18;
  display:grid;
  place-items:center;
  color:var(--muted);
  font:700 10px Arial;
  text-align:center;
  overflow:hidden;
  position:relative;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.current-ribbon{
  position:absolute;
  top:13px;
  right:-35px;
  width:130px;
  padding:6px 0;
  transform:rotate(45deg);
  background:var(--gold);
  color:#17130e;
  text-align:center;
  font:900 8px Arial;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.book-body{
  padding:16px;
}

.book-body h3{
  margin:0 0 6px;
  font-size:20px;
  font-weight:400;
  line-height:1.15;
}

.author{
  color:var(--gold2);
  font:700 11px Arial;
  margin-bottom:10px;
}

.meta{
  color:var(--muted);
  font:10px/1.55 Arial;
  margin-top:4px;
}

.edition-meta{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line-soft);
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--gold2);
  font:800 8px Arial;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.badge.current{
  border-color:var(--gold);
  background:rgba(199,155,89,.1);
  color:var(--gold2);
}

.badge.past{
  color:var(--muted);
}

.badge.upcoming{
  color:#c8d8c7;
  border-color:rgba(185,214,178,.3);
}

.view-hint{
  margin-top:12px;
  color:#756e63;
  font:800 8px Arial;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.empty{
  grid-column:1/-1;
  padding:56px 24px;
  border:1px solid var(--line);
  border-radius:18px;
  text-align:center;
  color:var(--muted);
  font:13px/1.7 Arial;
  background:rgba(16,20,16,.72);
}

.empty strong{
  display:block;
  color:var(--cream);
  font-size:24px;
  font-weight:400;
  margin-bottom:8px;
}

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:var(--ink);
  z-index:1000;
}

.loading.hidden{
  display:none;
}

.loading span{
  color:var(--gold2);
  font:800 10px Arial;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.mobile-nav{
  display:none;
}

@media(max-width:950px){
  .shelf{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:700px){
  .nav{
    display:none;
  }

  .shelf{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .toolbar{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    width:100%;
  }

  .mobile-nav{
    position:fixed;
    left:12px;
    right:12px;
    bottom:12px;
    z-index:200;
    min-height:64px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(9,11,10,.95);
    backdrop-filter:blur(14px);
  }

  .mobile-nav a{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:var(--muted);
    text-decoration:none;
    font:9px Arial;
    text-transform:uppercase;
  }

  .mobile-nav a span:first-child{
    color:var(--gold2);
    font-size:17px;
  }

  .page{
    padding-bottom:120px;
  }
}

@media(max-width:460px){
  .shelf{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<script>
const SUPABASE_URL =
  "https://nrtutxjznkfvvbmaagum.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_C2t5VVsQQGqHhniETEky6A_XDK1Oycu";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const $ =
  id =>
    document.getElementById(id);

const params =
  new URLSearchParams(
    location.search
  );

const clubId =
  params.get("id");

let currentUser = null;
let books = [];
let clubData = null;

/* =========================================
   LINKS
   ========================================= */

function withClub(filename){

  return clubId
    ? filename +
      "?id=" +
      encodeURIComponent(clubId)
    : filename;

}

function wireLinks(){

  $("backLink").href =
    withClub("club.html");

  $("overviewLink").href =
    withClub("club.html");

  $("membersLink").href =
    withClub("club-members.html");

  $("discussionsLink").href =
    withClub("club-discussions.html");

  $("voteLink").href =
    withClub("club-vote.html");

  $("booksLink").href =
    withClub("club-books.html");

  $("settingsLink").href =
    withClub("club-settings.html");

}

/* =========================================
   HELPERS
   ========================================= */

function escapeHtml(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[character])
    );

}

function initials(name="Reader"){

  const parts =
    String(name)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(!parts.length)
    return "?";

  if(parts.length === 1)
    return parts[0]
      .charAt(0)
      .toUpperCase();

  return (
    parts[0].charAt(0) +
    parts[parts.length - 1].charAt(0)
  ).toUpperCase();

}

function normalizeStatus(value=""){

  return String(value)
    .trim()
    .toLowerCase();

}

function authorText(value){

  if(Array.isArray(value))
    return value.join(", ");

  return value || "";

}

function formatMonth(value){

  if(!value)
    return "";

  const raw =
    String(value);

  const match =
    raw.match(
      /^(\d{4})-(\d{2})(?:-(\d{2}))?$/
    );

  if(match){

    const year =
      Number(match[1]);

    const month =
      Number(match[2]);

    if(
      month >= 1 &&
      month <= 12
    ){

      return new Date(
        year,
        month - 1,
        1
      ).toLocaleDateString(
        undefined,
        {
          month:"long",
          year:"numeric"
        }
      );

    }

  }

  return raw;

}

/* =========================================
   NORMALIZE CLUB BOOK
   ========================================= */

function normalizeClubBook(row){

  const central =
    row.books || {};

  const title =
    central.title ||
    row.title ||
    row.book_title ||
    "Untitled Book";

  const author =
    authorText(
      central.authors ||
      row.authors ||
      row.author ||
      row.book_author
    ) ||
    "Unknown author";

  const cover =
    central.cover_url ||
    row.cover_url ||
    row.image_url ||
    "";

  const isbn13 =
    central.isbn_13 ||
    row.isbn_13 ||
    row.isbn13 ||
    row.isbn ||
    "";

  const isbn10 =
    central.isbn_10 ||
    row.isbn_10 ||
    "";

  const publisher =
    central.publisher ||
    row.publisher ||
    "";

  const publishedDate =
    central.published_date ||
    row.published_date ||
    row.publication_date ||
    "";

  const googleBooksId =
    central.google_books_id ||
    row.google_books_id ||
    "";

  const bookId =
    row.book_id ||
    row.central_book_id ||
    central.id ||
    null;

  const status =
    normalizeStatus(
      row.status ||
      row.read_status ||
      row.selection_status
    );

  const readMonth =
    row.read_month ||
    row.selected_month ||
    row.month_label ||
    "";

  const isCurrent =
    row.is_current === true ||
    [
      "current",
      "reading",
      "active"
    ].includes(status);

  let statusLabel =
    "Club Read";

  let statusClass =
    "past";

  if(isCurrent){

    statusLabel =
      "Current Selection";

    statusClass =
      "current";

  }
  else if(
    [
      "selected",
      "upcoming",
      "scheduled"
    ].includes(status)
  ){

    statusLabel =
      "Upcoming Selection";

    statusClass =
      "upcoming";

  }

  return {
    ...row,
    title,
    author,
    cover,
    isbn13,
    isbn10,
    publisher,
    publishedDate,
    googleBooksId,
    bookId,
    readMonth,
    isCurrent,
    status,
    statusLabel,
    statusClass
  };

}

/* =========================================
   BOOK DETAIL URL
   ========================================= */

function getBookDetailUrl(book){

  if(!book.bookId)
    return null;

  return (
    "book.html?id=" +
    encodeURIComponent(
      book.bookId
    )
  );

}

/* =========================================
   SORT BOOKS
   ========================================= */

function sortBooks(list){

  return [...list].sort(
    (a,b) => {

      if(
        a.isCurrent &&
        !b.isCurrent
      )
        return -1;

      if(
        !a.isCurrent &&
        b.isCurrent
      )
        return 1;

      const monthA =
        a.readMonth
          ? new Date(a.readMonth).getTime()
          : 0;

      const monthB =
        b.readMonth
          ? new Date(b.readMonth).getTime()
          : 0;

      if(monthA !== monthB)
        return monthB - monthA;

      const createdA =
        a.created_at
          ? new Date(a.created_at).getTime()
          : 0;

      const createdB =
        b.created_at
          ? new Date(b.created_at).getTime()
          : 0;

      return createdB - createdA;

    }
  );

}

/* =========================================
   RENDER BOOKS
   ========================================= */

function renderBooks(list){

  const shelf =
    $("shelf");

  shelf.innerHTML =
    "";

  $("shelfSummary").textContent =
    list.length === 1
      ? "1 book"
      : list.length + " books";

  if(!list.length){

    shelf.innerHTML = `
      <div class="empty">
        <strong>
          The shelf is still empty.
        </strong>

        Once the club selects its first monthly book,
        it will appear here.
      </div>
    `;

    return;

  }

  for(const book of list){

    const detailUrl =
      getBookDetailUrl(book);

    const editionParts =
      [];

    if(book.publisher)
      editionParts.push(
        book.publisher
      );

    if(book.publishedDate)
      editionParts.push(
        book.publishedDate
      );

    if(book.isbn13)
      editionParts.push(
        "ISBN-13 " +
        book.isbn13
      );
    else if(book.isbn10)
      editionParts.push(
        "ISBN-10 " +
        book.isbn10
      );

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "book-card" +
      (
        book.isCurrent
          ? " current"
          : ""
      );

    if(detailUrl){

      card.classList.add(
        "clickable"
      );

      card.tabIndex =
        0;

      card.setAttribute(
        "role",
        "link"
      );

      card.setAttribute(
        "aria-label",
        "View " +
        book.title
      );

    }

    card.innerHTML = `

      <div class="cover">

        ${
          book.cover
            ? `
              <img
                src="${escapeHtml(book.cover)}"
                alt="${escapeHtml(book.title)} cover">
            `
            : "No cover"
        }

        ${
          book.isCurrent
            ? `
              <div class="current-ribbon">
                Reading Now
              </div>
            `
            : ""
        }

      </div>

      <div class="book-body">

        <h3>
          ${escapeHtml(book.title)}
        </h3>

        <div class="author">
          ${escapeHtml(book.author)}
        </div>

        ${
          book.readMonth
            ? `
              <div class="meta">
                ${
                  book.isCurrent
                    ? "Reading "
                    : (
                        book.statusClass ===
                        "upcoming"
                          ? "Scheduled "
                          : "Read "
                      )
                }
                ${escapeHtml(
                  formatMonth(
                    book.readMonth
                  )
                )}
              </div>
            `
            : ""
        }

        ${
          editionParts.length
            ? `
              <div class="edition-meta">

                <div class="meta">
                  ${escapeHtml(
                    editionParts.join(
                      " · "
                    )
                  )}
                </div>

              </div>
            `
            : ""
        }

        <div class="badges">

          <span
            class="badge ${escapeHtml(
              book.statusClass
            )}"
          >
            ${escapeHtml(
              book.statusLabel
            )}
          </span>

        </div>

        ${
          detailUrl
            ? `
              <div class="view-hint">
                View book details →
              </div>
            `
            : ""
        }

      </div>
    `;

    if(detailUrl){

      card.addEventListener(
        "click",
        () => {

          location.href =
            detailUrl;

        }
      );

      card.addEventListener(
        "keydown",
        event => {

          if(
            event.key === "Enter" ||
            event.key === " "
          ){

            event.preventDefault();

            location.href =
              detailUrl;

          }

        }
      );

    }

    shelf.appendChild(
      card
    );

  }

}

/* =========================================
   PROFILE
   ========================================= */

async function loadProfile(){

  let display =
    currentUser
      ?.user_metadata
      ?.display_name ||
    "Reader";

  let avatar =
    "";

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "get_public_profile",
          {
            check_user_id:
              currentUser.id
          }
        );

    if(error)
      throw error;

    const profile =
      Array.isArray(data)
        ? data[0]
        : data;

    if(profile){

      display =
        profile.display_name ||
        display;

      avatar =
        profile.avatar_url ||
        "";

    }

  }
  catch(error){

    console.warn(
      "Profile lookup:",
      error.message
    );

  }

  const holder =
    $("navAvatar");

  holder.innerHTML =
    "";

  if(avatar){

    const image =
      document.createElement(
        "img"
      );

    image.src =
      avatar;

    image.alt =
      display;

    image.onerror =
      () => {

        holder.innerHTML =
          "";

        holder.textContent =
          initials(display);

      };

    holder.appendChild(
      image
    );

  }
  else{

    holder.textContent =
      initials(display);

  }

}

/* =========================================
   CLUB
   ========================================= */

async function loadClub(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("clubs")
      .select("*")
      .eq(
        "id",
        clubId
      )
      .maybeSingle();

  if(error)
    throw error;

  if(!data){

    location.href =
      "clubs.html";

    return;

  }

  clubData =
    data;

  $("clubName").textContent =
    data.name ||
    "Book Club";

  document.title =
    "DogEar — " +
    (
      data.name ||
      "Club"
    ) +
    " Bookshelf";

}

/* =========================================
   LOAD BOOKS
   ========================================= */

async function loadBooks(){

  /*
    Preferred query:
    club_books.book_id -> books.id

    If Supabase cannot resolve the relationship,
    the fallback below still loads club_books
    without breaking the page.
  */

  let rows =
    null;

  let preferredError =
    null;

  const preferred =
    await supabaseClient
      .from("club_books")
      .select(`
        *,
        books:book_id (
          id,
          isbn_13,
          isbn_10,
          google_books_id,
          title,
          subtitle,
          authors,
          publisher,
          published_date,
          description,
          cover_url,
          affiliate_url
        )
      `)
      .eq(
        "club_id",
        clubId
      )
      .order(
        "read_month",
        {
          ascending:false,
          nullsFirst:false
        }
      );

  if(preferred.error){

    preferredError =
      preferred.error;

  }
  else{

    rows =
      preferred.data || [];

  }

  if(rows === null){

    console.warn(
      "Joined club_books query unavailable; using compatibility query:",
      preferredError?.message
    );

    const fallback =
      await supabaseClient
        .from("club_books")
        .select("*")
        .eq(
          "club_id",
          clubId
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(fallback.error)
      throw fallback.error;

    rows =
      fallback.data || [];

  }

  books =
    sortBooks(
      rows.map(
        normalizeClubBook
      )
    );

  renderBooks(
    books
  );

}

/* =========================================
   SEARCH
   ========================================= */

$("bookSearch")
  .addEventListener(
    "input",
    event => {

      const query =
        event.target
          .value
          .trim()
          .toLowerCase();

      if(!query){

        renderBooks(
          books
        );

        return;

      }

      const filtered =
        books.filter(
          book => {

            const haystack =
              [
                book.title,
                book.author,
                book.readMonth,
                formatMonth(
                  book.readMonth
                ),
                book.publisher,
                book.publishedDate,
                book.isbn13,
                book.isbn10,
                book.googleBooksId,
                book.status,
                book.statusLabel
              ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

            return haystack.includes(
              query
            );

          }
        );

      renderBooks(
        filtered
      );

    }
  );

/* =========================================
   START
   ========================================= */

async function start(){

  if(!clubId){

    location.href =
      "clubs.html";

    return;

  }

  wireLinks();

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getUser();

  if(
    error ||
    !data.user
  ){

    location.href =
      "auth.html#login";

    return;

  }

  currentUser =
    data.user;

  try{

    await Promise.all([
      loadProfile(),
      loadClub()
    ]);

    await loadBooks();

  }
  catch(error){

    console.error(
      "Club bookshelf:",
      error
    );

    books =
      [];

    $("shelf").innerHTML = `
      <div class="empty">

        <strong>
          DogEar couldn't open this bookshelf.
        </strong>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

      </div>
    `;

    $("shelfSummary").textContent =
      "";

  }

  $("loading")
    .classList
    .add("hidden");

}

start();
</script>
