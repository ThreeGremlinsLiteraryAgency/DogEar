<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Paper Gremlin — Club Bookshelf</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {

      --ink:#090b0a;
      --panel:#101410;
      --panel2:#151a15;

      --cream:#f1e7cf;
      --cream2:#d9cfb8;

      --gold:#c79b59;
      --gold2:#dfbd7e;

      --green:#26362b;
      --green2:#34483a;

      --muted:#aaa18f;

      --line:rgba(199,155,89,.22);
      --line-soft:rgba(199,155,89,.11);

      --success:#b9d6b2;
      --current:#dfbd7e;

    }


    * {

      box-sizing:border-box;

    }


    html {

      scroll-behavior:smooth;

    }


    body {

      margin:0;

      min-height:100vh;

      color:var(--cream);

      background:
        radial-gradient(
          circle at 8% 0%,
          rgba(53,73,59,.28),
          transparent 26%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(199,155,89,.07),
          transparent 24%
        ),
        var(--ink);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

    }


    button,
    input {

      font:inherit;

    }


    a {

      color:inherit;

    }


    /* =====================================================
       LOADING
       ===================================================== */


    .loading {

      position:fixed;

      inset:0;

      z-index:1000;

      display:grid;

      place-items:center;

      background:var(--ink);

      transition:
        opacity .2s ease,
        visibility .2s ease;

    }


    .loading.hidden {

      opacity:0;

      visibility:hidden;

      pointer-events:none;

    }


    .loading-inner {

      text-align:center;

    }


    .loading-mark {

      width:48px;

      height:48px;

      margin:
        0 auto 18px;

      border:
        1px solid
        var(--gold);

      border-radius:
        50% 50% 50% 12%;

      animation:
        loadingFloat
        1.5s
        ease-in-out
        infinite;

    }


    .loading span {

      color:var(--gold2);

      font:
        800 10px
        Arial,
        sans-serif;

      letter-spacing:.16em;

      text-transform:uppercase;

    }


    @keyframes loadingFloat {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(-8deg);

      }

      50% {

        transform:
          translateY(-6px)
          rotate(-8deg);

      }

    }


    /* =====================================================
       TOP BAR
       ===================================================== */


    .topbar {

      min-height:76px;

      padding:
        0
        clamp(
          18px,
          4vw,
          60px
        );

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:24px;

      position:sticky;

      top:0;

      z-index:100;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(9,11,10,.95);

      backdrop-filter:
        blur(14px);

    }


    .brand {

      display:flex;

      align-items:center;

      gap:11px;

      color:var(--gold2);

      text-decoration:none;

      font:
        800 13px
        Arial,
        sans-serif;

      letter-spacing:.17em;

      text-transform:uppercase;

    }


    .brand-mark {

      width:34px;

      height:34px;

      position:relative;

      border:
        1px solid
        var(--gold);

      border-radius:
        50% 50% 50% 12%;

      transform:
        rotate(-8deg);

    }


    .brand-mark::after {

      content:"";

      position:absolute;

      width:8px;

      height:8px;

      right:7px;

      top:7px;

      border-radius:50%;

      background:var(--gold);

    }


    .nav {

      display:flex;

      align-items:center;

      gap:24px;

      font:
        700 11px
        Arial,
        sans-serif;

      letter-spacing:.1em;

      text-transform:uppercase;

    }


    .nav a {

      color:var(--muted);

      text-decoration:none;

    }


    .nav a:hover,
    .nav a.active {

      color:var(--gold2);

    }


    .avatar {

      width:38px;

      height:38px;

      display:grid;

      place-items:center;

      overflow:hidden;

      border:
        1px solid
        var(--line);

      border-radius:50%;

      background:var(--green);

      text-decoration:none;

      font:
        800 12px
        Arial,
        sans-serif;

    }


    .avatar img {

      width:100%;

      height:100%;

      object-fit:cover;

    }


    /* =====================================================
       PAGE
       ===================================================== */


    .page {

      width:
        min(
          1240px,
          calc(100% - 32px)
        );

      margin:auto;

      padding:
        36px 0 110px;

    }


    .back {

      display:inline-block;

      margin-bottom:20px;

      color:var(--muted);

      text-decoration:none;

      font:
        800 9px
        Arial,
        sans-serif;

      letter-spacing:.09em;

      text-transform:uppercase;

    }


    .back:hover {

      color:var(--gold2);

    }


    /* =====================================================
       CLUB HEADER
       ===================================================== */


    .club-head {

      padding:
        clamp(
          24px,
          4vw,
          38px
        );

      border:
        1px solid
        var(--line);

      border-radius:22px;

      background:
        linear-gradient(
          135deg,
          rgba(38,54,43,.72),
          rgba(16,20,16,.9)
        );

    }


    .eyebrow {

      margin-bottom:8px;

      color:var(--gold);

      font:
        800 9px
        Arial,
        sans-serif;

      letter-spacing:.16em;

      text-transform:uppercase;

    }


    .club-head h1 {

      margin:0;

      font-size:
        clamp(
          38px,
          5vw,
          58px
        );

      line-height:.96;

      font-weight:400;

      letter-spacing:-.035em;

    }


    .club-sub {

      max-width:720px;

      margin-top:13px;

      color:var(--cream2);

      font:
        11px/1.7
        Arial,
        sans-serif;

    }


    /* =====================================================
       CLUB NAV
       ===================================================== */


    .club-nav {

      margin-top:18px;

      display:flex;

      gap:7px;

      overflow-x:auto;

      scrollbar-width:none;

    }


    .club-nav::-webkit-scrollbar {

      display:none;

    }


    .club-nav a {

      flex:0 0 auto;

      min-height:37px;

      padding:
        0 14px;

      display:flex;

      align-items:center;

      border:
        1px solid
        var(--line);

      border-radius:999px;

      color:var(--muted);

      text-decoration:none;

      font:
        800 8px
        Arial,
        sans-serif;

      letter-spacing:.07em;

      text-transform:uppercase;

    }


    .club-nav a:hover,
    .club-nav a.active {

      border-color:var(--gold);

      color:var(--gold2);

    }


    /* =====================================================
       TOOLBAR
       ===================================================== */


    .toolbar {

      margin-top:24px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:14px;

    }


    .search {

      width:
        min(
          460px,
          100%
        );

      min-height:44px;

      padding:
        0 16px;

      border:
        1px solid
        var(--line);

      border-radius:999px;

      outline:none;

      background:
        rgba(16,20,16,.88);

      color:var(--cream);

      font:
        11px
        Arial,
        sans-serif;

    }


    .search::placeholder {

      color:var(--muted);

    }


    .search:focus {

      border-color:var(--gold);

    }


    .shelf-count {

      color:var(--muted);

      font:
        800 9px
        Arial,
        sans-serif;

      letter-spacing:.07em;

      text-transform:uppercase;

    }


    /* =====================================================
       SHELF
       ===================================================== */


    .shelf {

      margin-top:20px;

      display:grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );

      gap:18px;

    }


    .book-card {

      min-width:0;

      overflow:hidden;

      position:relative;

      border:
        1px solid
        var(--line);

      border-radius:17px;

      background:
        rgba(16,20,16,.84);

      cursor:pointer;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;

    }


    .book-card:hover {

      transform:
        translateY(-3px);

      border-color:
        rgba(199,155,89,.5);

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

    }


    .book-card:focus {

      outline:
        1px solid
        var(--gold);

      outline-offset:3px;

    }


    .cover {

      width:100%;

      aspect-ratio:
        2 / 3;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      position:relative;

      border-bottom:
        1px solid
        var(--line-soft);

      background:
        linear-gradient(
          145deg,
          rgba(199,155,89,.08),
          rgba(38,54,43,.72)
        );

      color:var(--muted);

      text-align:center;

      font:
        10px/1.5
        Arial,
        sans-serif;

    }


    .cover img {

      width:100%;

      height:100%;

      display:block;

      object-fit:cover;

    }


    .book-body {

      padding:16px;

    }


    .book-body h3 {

      margin:
        0 0 6px;

      font-size:20px;

      line-height:1.08;

      font-weight:400;

    }


    .author {

      margin-bottom:10px;

      color:var(--gold2);

      font:
        700 11px
        Arial,
        sans-serif;

    }


    .meta {

      color:var(--muted);

      font:
        10px/1.5
        Arial,
        sans-serif;

    }


    .edition-meta {

      margin-top:6px;

    }


    .badges {

      display:flex;

      flex-wrap:wrap;

      gap:6px;

    }


    .badge {

      display:inline-block;

      margin-top:10px;

      padding:
        6px 9px;

      border:
        1px solid
        var(--line);

      border-radius:999px;

      color:var(--gold2);

      font:
        800 8px
        Arial,
        sans-serif;

      letter-spacing:.08em;

      text-transform:uppercase;

    }


    .badge.current {

      border-color:
        rgba(223,189,126,.45);

      background:
        rgba(223,189,126,.08);

      color:var(--current);

    }


    .badge.read {

      border-color:
        rgba(185,214,178,.35);

      background:
        rgba(185,214,178,.05);

      color:var(--success);

    }


    .view-hint {

      margin-top:13px;

      color:var(--gold2);

      font:
        800 8px
        Arial,
        sans-serif;

      letter-spacing:.06em;

      text-transform:uppercase;

    }


    /* =====================================================
       EMPTY
       ===================================================== */


    .empty {

      grid-column:
        1 / -1;

      padding:
        56px 24px;

      border:
        1px solid
        var(--line);

      border-radius:18px;

      background:
        rgba(16,20,16,.72);

      color:var(--muted);

      text-align:center;

      font:
        13px/1.7
        Arial,
        sans-serif;

    }


    .empty strong {

      display:block;

      margin-bottom:8px;

      color:var(--cream);

      font-size:24px;

      font-weight:400;

    }


    /* =====================================================
       MOBILE NAV
       ===================================================== */


    .mobile-nav {

      display:none;

    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */


    @media(
      max-width:950px
    ) {

      .shelf {

        grid-template-columns:
          repeat(
            3,
            minmax(0,1fr)
          );

      }

    }


    @media(
      max-width:700px
    ) {

      .nav {

        display:none;

      }


      .shelf {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

      }


      .toolbar {

        align-items:stretch;

        flex-direction:column;

      }


      .search {

        width:100%;

      }


      .mobile-nav {

        position:fixed;

        left:12px;

        right:12px;

        bottom:12px;

        z-index:200;

        min-height:64px;

        display:grid;

        grid-template-columns:
          repeat(4,1fr);

        border:
          1px solid
          var(--line);

        border-radius:18px;

        background:
          rgba(9,11,10,.95);

        backdrop-filter:
          blur(14px);

      }


      .mobile-nav a {

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:center;

        gap:4px;

        color:var(--muted);

        text-decoration:none;

        font:
          9px
          Arial,
          sans-serif;

        text-transform:uppercase;

      }


      .mobile-nav a span:first-child {

        color:var(--gold2);

        font-size:17px;

      }


      .page {

        padding-bottom:120px;

      }

    }


    @media(
      max-width:460px
    ) {

      .page {

        width:
          calc(
            100% - 22px
          );

      }


      .shelf {

        grid-template-columns:1fr;

      }

    }

  </style>

</head>


<body>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->


  <script>


    /* =====================================================
       SUPABASE
       ===================================================== */


    const SUPABASE_URL =
      "https://nrtutxjznkfvvbmaagum.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_C2t5VVsQQGqHhniETEky6A_XDK1Oycu";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================================
       STATE
       ===================================================== */


    const $ =
      id =>
        document.getElementById(
          id
        );


    const params =
      new URLSearchParams(
        location.search
      );


    const clubId =
      params.get(
        "id"
      );


    let currentUser =
      null;


    let books =
      [];


    let club =
      null;


    /* =====================================================
       CLUB LINKS
       ===================================================== */


    function withClub(
      filename
    ) {


      return clubId
        ? (
            filename +
            "?id=" +
            encodeURIComponent(
              clubId
            )
          )
        : filename;


    }


    function wireLinks() {


      $("backLink").href =
        withClub(
          "club.html"
        );


      $("overviewLink").href =
        withClub(
          "club.html"
        );


      $("membersLink").href =
        withClub(
          "club-members.html"
        );


      $("discussionsLink").href =
        withClub(
          "club-discussions.html"
        );


      $("voteLink").href =
        withClub(
          "club-vote.html"
        );


      $("booksLink").href =
        withClub(
          "club-books.html"
        );


      $("settingsLink").href =
        withClub(
          "club-settings.html"
        );


    }


    /* =====================================================
       BOOK DETAIL URL
       ===================================================== */


    function bookDetailsUrl(
      book
    ) {


      const bookId =
        book?.book_id ||
        book?.id ||
        null;


      if (!bookId) {

        return "";

      }


      const returnUrl =
        withClub(
          "club-books.html"
        );


      return (
        "book-detail.html?" +
        new URLSearchParams({

          id:String(
            bookId
          ),

          return:returnUrl

        }).toString()
      );


    }


    /* =====================================================
       HELPERS
       ===================================================== */


    function escapeHtml(
      value = ""
    ) {


      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );


    }


    function initials(
      name = "Reader"
    ) {


      const parts =
        String(
          name
        )
          .trim()
          .split(
            /\s+/
          )
          .filter(
            Boolean
          );


      if (!parts.length) {

        return "?";

      }


      if (
        parts.length === 1
      ) {

        return parts[0]
          .charAt(0)
          .toUpperCase();

      }


      return (
        parts[0]
          .charAt(0) +
        parts[
          parts.length - 1
        ]
          .charAt(0)
      )
        .toUpperCase();


    }


    function authorText(
      book
    ) {


      if (
        Array.isArray(
          book?.authors
        )
      ) {

        return book.authors
          .filter(Boolean)
          .join(", ");

      }


      return (
        book?.author ||
        book?.book_author ||
        book?.authors ||
        "Unknown author"
      );


    }


    function coverUrl(
      book
    ) {


      return (
        book?.cover_url ||
        book?.thumbnail_url ||
        book?.image_url ||
        ""
      );


    }


    function statusInfo(
      book
    ) {


      const raw =
        String(
          book?.status ||
          book?.read_status ||
          book?.selection_status ||
          ""
        )
          .trim()
          .toLowerCase();


      if (
        raw === "current" ||
        raw === "current_read" ||
        raw === "reading" ||
        raw === "selected"
      ) {


        return {

          label:"Current Read",

          className:"current"

        };


      }


      if (
        raw === "read" ||
        raw === "finished" ||
        raw === "complete" ||
        raw === "completed" ||
        raw === "past"
      ) {


        return {

          label:"Read",

          className:"read"

        };


      }


      return {

        label:
          raw
            ? raw.replace(
                /_/g,
                " "
              )
            : "Club Book",

        className:""

      };


    }


    function readMonthText(
      book
    ) {


      return (
        book?.read_month ||
        book?.selected_month ||
        book?.month_label ||
        ""
      );


    }


    function editionText(
      book
    ) {


      const parts =
        [];


      const format =
        book?.format ||
        book?.binding ||
        "";


      if (format) {

        parts.push(
          format
        );

      }


      const pages =
        book?.page_count ||
        book?.pages ||
        "";


      if (pages) {

        parts.push(
          String(
            pages
          ) +
          " pages"
        );

      }


      const isbn =
        book?.isbn_13 ||
        book?.isbn13 ||
        book?.isbn ||
        "";


      if (isbn) {

        parts.push(
          "ISBN " +
          isbn
        );

      }


      return parts;


    }
        /* =====================================================
       RENDER BOOKS
       ===================================================== */


    function renderBooks(
      list
    ) {


      const shelf =
        $("shelf");


      shelf.innerHTML =
        "";


      const safeList =
        Array.isArray(
          list
        )
          ? list
          : [];


      $("shelfCount").textContent =
        safeList.length === 1
          ? "1 book"
          : (
              safeList.length +
              " books"
            );


      if (
        !safeList.length
      ) {


        shelf.innerHTML = `
          <div class="empty">

            <strong>
              The shelf is still empty.
            </strong>

            Once the club finishes or selects books,
            they'll appear here.

          </div>
        `;


        return;


      }


      for (
        const book
        of safeList
      ) {


        const title =
          book.title ||
          book.book_title ||
          "Untitled Book";


        const author =
          authorText(
            book
          );


        const cover =
          coverUrl(
            book
          );


        const readMonth =
          readMonthText(
            book
          );


        const status =
          statusInfo(
            book
          );


        const editionParts =
          editionText(
            book
          );


        const detailUrl =
          bookDetailsUrl(
            book
          );


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "book-card";


        if (
          detailUrl
        ) {


          card.tabIndex =
            0;


          card.setAttribute(
            "role",
            "link"
          );


          card.setAttribute(
            "aria-label",
            "View " +
            title +
            " book details"
          );


        }


        const coverMarkup =
          cover
            ? `
                <img
                  src="${escapeHtml(
                    cover
                  )}"
                  alt="${escapeHtml(
                    title
                  )} cover"
                  loading="lazy"
                >
              `
            : `
                <span>
                  ${escapeHtml(
                    title
                  )}
                </span>
              `;


        card.innerHTML = `

          <div class="cover">

            ${coverMarkup}

          </div>


          <div class="book-body">

            <h3>

              ${escapeHtml(
                title
              )}

            </h3>


            <div class="author">

              ${escapeHtml(
                author
              )}

            </div>


            ${
              readMonth
                ? `
                    <div class="meta">

                      ${
                        status.className ===
                        "current"
                          ? "Selected "
                          : "Read "
                      }

                      ${escapeHtml(
                        readMonth
                      )}

                    </div>
                  `
                : ""
            }


            ${
              editionParts.length
                ? `
                    <div class="edition-meta">

                      <div class="meta">

                        ${escapeHtml(
                          editionParts.join(
                            " · "
                          )
                        )}

                      </div>

                    </div>
                  `
                : ""
            }


            <div class="badges">

              <span
                class="badge ${escapeHtml(
                  status.className
                )}"
              >

                ${escapeHtml(
                  status.label
                )}

              </span>

            </div>


            ${
              detailUrl
                ? `
                    <div class="view-hint">
                      View book details →
                    </div>
                  `
                : ""
            }

          </div>

        `;


        if (
          detailUrl
        ) {


          card.addEventListener(
            "click",
            () => {


              location.href =
                detailUrl;


            }
          );


          card.addEventListener(
            "keydown",
            event => {


              if (
                event.key === "Enter" ||
                event.key === " "
              ) {


                event.preventDefault();


                location.href =
                  detailUrl;


              }


            }
          );


        }


        shelf.appendChild(
          card
        );


      }


    }


    /* =====================================================
       PROFILE
       ===================================================== */


    async function loadProfile() {


      let display =
        currentUser
          ?.user_metadata
          ?.display_name ||
        "Reader";


      let avatar =
        "";


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "get_public_profile",
              {
                check_user_id:
                  currentUser.id
              }
            );


        if (error) {

          throw error;

        }


        const profile =
          Array.isArray(
            data
          )
            ? data[0]
            : data;


        if (profile) {


          display =
            profile.display_name ||
            display;


          avatar =
            profile.avatar_url ||
            "";


        }


      }

      catch (error) {


        console.warn(
          "Profile lookup:",
          error.message
        );


      }


      const holder =
        $("navAvatar");


      holder.innerHTML =
        "";


      if (avatar) {


        const image =
          document.createElement(
            "img"
          );


        image.src =
          avatar;


        image.alt =
          display;


        image.onerror =
          () => {


            holder.innerHTML =
              "";


            holder.textContent =
              initials(
                display
              );


          };


        holder.appendChild(
          image
        );


      }

      else {


        holder.textContent =
          initials(
            display
          );


      }


    }


    /* =====================================================
       CLUB
       ===================================================== */


    async function loadClub() {


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "clubs"
            )
            .select(
              "id,name"
            )
            .eq(
              "id",
              clubId
            )
            .maybeSingle();


        if (error) {

          throw error;

        }


        if (!data) {


          location.href =
            "clubs.html";


          return false;


        }


        club =
          data;


        $("clubName").textContent =
          data.name ||
          "Book Club";


        document.title =
          "Paper Gremlin — " +
          (
            data.name ||
            "Club"
          ) +
          " Bookshelf";


        return true;


      }

      catch (error) {


        console.error(
          "Club lookup:",
          error
        );


        $("clubName").textContent =
          "Book Club";


        return false;


      }


    }


    /* =====================================================
       LOAD CLUB BOOK ROWS
       ===================================================== */


    async function loadBooks() {


      try {


        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "club_books"
            )
            .select(
              "*"
            )
            .eq(
              "club_id",
              clubId
            )
            .order(
              "created_at",
              {
                ascending:false
              }
            );


        if (error) {

          throw error;

        }


        const clubBookRows =
          Array.isArray(
            data
          )
            ? data
            : [];


        /*
          IMPORTANT:

          club_books.id is the bookshelf-row ID.

          book-detail.html expects books.id.

          So before rendering, hydrate every bookshelf
          row against the canonical books table using
          club_books.book_id.
        */


        books =
          await hydrateBookRows(
            clubBookRows
          );


        renderBooks(
          books
        );


      }

      catch (error) {


        console.error(
          "Club books lookup:",
          error
        );


        books =
          [];


        renderBooks(
          []
        );


      }


    }


    /* =====================================================
       HYDRATE AGAINST BOOKS TABLE
       ===================================================== */


    async function hydrateBookRows(
      clubBookRows
    ) {


      if (
        !clubBookRows.length
      ) {

        return [];

      }


      const canonicalIds =
        [
          ...new Set(

            clubBookRows
              .map(
                row =>
                  row.book_id
              )
              .filter(
                value =>
                  value !== null &&
                  value !== undefined &&
                  value !== ""
              )
              .map(
                value =>
                  String(
                    value
                  )
              )

          )
        ];


      /*
        If an older bookshelf row doesn't have book_id,
        keep the row usable instead of breaking the shelf.
      */


      if (
        !canonicalIds.length
      ) {


        return clubBookRows.map(
          row => ({

            ...row,

            shelf_row_id:
              row.id,

            canonical_book_id:
              null

          })
        );


      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "books"
          )
          .select(
            "*"
          )
          .in(
            "id",
            canonicalIds
          );


      if (error) {


        console.warn(
          "Canonical book hydration:",
          error.message
        );


        return clubBookRows.map(
          row => ({

            ...row,

            shelf_row_id:
              row.id,

            canonical_book_id:
              row.book_id ||
              null,

            id:
              row.book_id ||
              row.id

          })
        );


      }


      const canonicalBooks =
        Array.isArray(
          data
        )
          ? data
          : [];


      const byId =
        new Map();


      for (
        const book
        of canonicalBooks
      ) {


        byId.set(
          String(
            book.id
          ),
          book
        );


      }


      return clubBookRows.map(
        shelfRow => {


          const canonical =
            shelfRow.book_id
              ? byId.get(
                  String(
                    shelfRow.book_id
                  )
                )
              : null;


          /*
            Shelf-specific values stay available,
            but canonical book metadata takes priority
            for title, cover, author, ISBN, etc.

            The final id is explicitly the books.id.
          */


          if (canonical) {


            return {

              ...shelfRow,

              ...canonical,

              shelf_row_id:
                shelfRow.id,

              canonical_book_id:
                canonical.id,

              id:
                canonical.id,

              book_id:
                canonical.id,

              read_month:
                shelfRow.read_month ??
                shelfRow.selected_month ??
                shelfRow.month_label ??
                canonical.read_month ??
                "",

              selected_month:
                shelfRow.selected_month ??
                "",

              month_label:
                shelfRow.month_label ??
                "",

              status:
                shelfRow.status ??
                shelfRow.read_status ??
                shelfRow.selection_status ??
                canonical.status ??
                "",

              read_status:
                shelfRow.read_status ??
                "",

              selection_status:
                shelfRow.selection_status ??
                ""

            };


          }


          /*
            If the referenced book has disappeared from
            books, keep the historical shelf card visible,
            but still use book_id as the detail target.
          */


          return {

            ...shelfRow,

            shelf_row_id:
              shelfRow.id,

            canonical_book_id:
              shelfRow.book_id ||
              null,

            id:
              shelfRow.book_id ||
              shelfRow.id

          };


        }
      );


    }


    /* =====================================================
       SEARCH
       ===================================================== */


    $("bookSearch")
      .addEventListener(
        "input",
        event => {


          const query =
            event.target
              .value
              .trim()
              .toLowerCase();


          if (!query) {


            renderBooks(
              books
            );


            return;


          }


          const filtered =
            books.filter(
              book => {


                const haystack =
                  [

                    book.title,

                    book.book_title,

                    authorText(
                      book
                    ),

                    book.read_month,

                    book.selected_month,

                    book.month_label,

                    book.publisher,

                    book.published_date,

                    book.publication_date,

                    book.isbn,

                    book.isbn10,

                    book.isbn_10,

                    book.isbn13,

                    book.isbn_13,

                    book.format,

                    book.binding,

                    book.status,

                    book.read_status,

                    book.selection_status

                  ]
                    .filter(
                      Boolean
                    )
                    .join(
                      " "
                    )
                    .toLowerCase();


                return haystack.includes(
                  query
                );


              }
            );


          renderBooks(
            filtered
          );


        }
      );


    /* =====================================================
       AUTH
       ===================================================== */


    async function requireSession() {


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error) {

        throw error;

      }


      const session =
        data?.session ||
        null;


      if (
        !session?.user
      ) {


        const next =
          location.pathname
            .split("/")
            .pop() +
          location.search;


        location.href =
          "index.html?next=" +
          encodeURIComponent(
            next
          );


        return false;


      }


      currentUser =
        session.user;


      return true;


    }


    /* =====================================================
       AUTH CHANGES
       ===================================================== */


    supabaseClient
      .auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {


          if (
            event ===
            "SIGNED_OUT"
          ) {


            location.href =
              "index.html";


            return;


          }


          if (
            session?.user
          ) {


            currentUser =
              session.user;


          }


        }
      );


    /* =====================================================
       START
       ===================================================== */


    async function startPage() {


      try {


        if (!clubId) {


          location.href =
            "clubs.html";


          return;


        }


        wireLinks();


        const authenticated =
          await requireSession();


        if (!authenticated) {

          return;

        }


        await Promise.all([

          loadProfile(),

          loadClub()

        ]);


        await loadBooks();


      }

      catch (error) {


        console.error(
          "Bookshelf startup:",
          error
        );


        books =
          [];


        renderBooks(
          []
        );


      }

      finally {


        $("loading")
          .classList
          .add(
            "hidden"
          );


      }


    }


    startPage();


  </script>
